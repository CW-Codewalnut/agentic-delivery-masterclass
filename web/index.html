sertEqual(1, len(self.store.events))\n\n    def test_already_cancelled_precedes_stale_version_for_new_intent(self) -> None:\n        self.service.cancel(\"ORD-1042\", \"customer-7\", \"req-006-first\", expected_version=1)\n\n        result = self.service.cancel(\n            \"ORD-1042\", \"customer-7\", \"req-006-later\", expected_version=1\n        )\n\n        self.assertEqual(CancellationCode.ALREADY_CANCELLED, result.code)\n        self.assertEqual(OrderStatus.CANCELLED, result.order_status)\n        self.assertEqual(2, result.order_version)\n        self.assertEqual(1, len(self.store.events))\n\n    def test_unknown_order_is_not_found(self) -> None:\n        result = self.service.cancel(\"ORD-missing\", \"customer-7\", \"req-008\")\n\n        self.assertEqual(CancellationCode.NOT_FOUND, result.code)\n        self.assertEqual(\"ORD-missing\", result.order_id)\n        self.assertEqual([], self.store.events)\n\n    def test_stale_expected_version_is_rejected(self) -> None:\n        result = self.service.cancel(\"ORD-1042\", \"customer-7\", \"req-009\", expected_version=99)\n\n        self.assertEqual(CancellationCode.VERSION_CONFLICT, result.code)\n        self.assertEqual(OrderStatus.CONFIRMED, self.store.get(\"ORD-1042\").status)\n        self.assertEqual([], self.store.events)\n\n    def test_concurrent_requests_emit_exactly_one_cancellation_event(self) -> None:\n        workers = 12\n        barrier = threading.Barrier(workers)\n\n        def attempt(index: int):\n            barrier.wait()\n            return self.service.cancel(\"ORD-1042\", \"customer-7\", f\"race-{index:02d}\")\n\n        with ThreadPoolExecutor(max_workers=workers) as pool:\n            results = list(pool.map(attempt, range(workers)))\n\n        codes = [result.code for result in results]\n        self.assertEqual(1, codes.count(CancellationCode.CANCELLED))\n        self.assertEqual(workers - 1, codes.count(CancellationCode.ALREADY_CANCELLED))\n        self.assertEqual(1, len(self.store.events))\n        self.assertEqual(2, self.store.get(\"ORD-1042\").version)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n", "sha256": "e168e33f8948f689ba79f45cf64af6c0f93d5c6c61540d3f0a884c7aad483898", "bytes": 6117}, "tests/test_prd_contract.py": {"path": "tests/test_prd_contract.py", "content": "\"\"\"Level 1 behavioural contract tests for a Capture & Refine PRD.\n\nEach defect is produced by mutating one maintained conforming fixture, so the\nfixture stays the single source of the expected shape. Every mutation asserts\nthat its target text existed exactly once; a mutation that no longer applies\nfails loudly instead of passing silently.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport subprocess\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nCHECKER = ROOT / \"scripts/check_prd_contract.py\"\nFIXTURE = ROOT / \"tests/fixtures/prd/conforming.md\"\nTEMPLATE = ROOT / \"agents/capture-refine/templates/capture-prd.md\"\n\nREQUIRED_SECTIONS = (\n    \"Evidence register\",\n    \"Intended behaviour\",\n    \"Assumption register\",\n    \"Requirements\",\n    \"Acceptance criteria\",\n    \"Non-functional criteria\",\n    \"Outcome contract\",\n    \"RED list\",\n    \"Decisions and gaps\",\n    \"Design state\",\n    \"Engineer completeness\",\n)\n\n# (case name, exact text to replace, replacement, expected finding code)\nMUTATIONS = (\n    (\n        \"dropped_section_heading\",\n        \"## Evidence register\\n\",\n        \"\",\n        \"missing_section\",\n    ),\n    (\n        \"invented_status_value\",\n        \"Status: `draft_for_engineer_completeness_review`\",\n        \"Status: `ready`\",\n        \"invalid_status\",\n    ),\n    (\n        \"requirement_without_source\",\n        \"| DEC-1, DOM-1 |\",\n        \"| to be confirmed |\",\n        \"untraced_requirement\",\n    ),\n    (\n        \"criterion_without_given_when_then\",\n        \"Given an order at `fulfilment_started`, when its owner asks to cancel it, then the outcome is `too_late` and the status, version, and event count do not change.\",\n        \"The order cannot be cancelled after fulfilment starts.\",\n        \"unshaped_criterion\",\n    ),\n    (\n        \"positive_criterion_paired_with_positive\",\n        \"| AC-6 | returned outcomes, order version, and event count |\",\n        \"| AC-1 | returned outcomes, order version, and event count |\",\n        \"missing_negative_counterpart\",\n    ),\n    (\n        \"counterpart_does_not_exist\",\n        \"| AC-2, AC-3, AC-8 |\",\n        \"| AC-99 |\",\n        \"unknown_counterpart\",\n    ),\n    (\n        \"criterion_cites_unknown_requirement\",\n        \"| AC-4 | FR-3 |\",\n        \"| AC-4 | FR-9 |\",\n        \"unknown_requirement\",\n    ),\n    (\n        \"duplicate_criterion_id\",\n        \"| AC-8 | FR-4 |\",\n        \"| AC-7 | FR-4 |\",\n        \"duplicate_id\",\n    ),\n    (\n        \"requirement_names_a_technology\",\n        \"A stale expected version is refused without any change to the order.\",\n        \"A stale expected version is refused by a check on the new database column.\",\n        \"implementation_leak\",\n    ),\n    (\n        \"observation_point_is_internal\",\n        \"| AC-4 | returned outcome and event count |\",\n        \"| AC-4 | the internal state of the idempotency map |\",\n        \"unobservable_criterion\",\n    ),\n    (\n        \"assumption_without_a_class\",\n        \"engineering_observable\",\n        \"probably fine\",\n        \"unclassified_assumption\",\n    ),\n    (\n        \"non_functional_class_removed\",\n        \"| auditability | One cancellation event records the actor, the order, and the time, and it is never rewritten. | 1 immutable event per cancelled order | staff engineer | behavioural_test |\\n\",\n        \"\",\n        \"missing_nonfunctional_class\",\n    ),\n    (\n        \"non_applicability_without_a_rationale\",\n        \"not_applicable in this revision. The scope holds no user interface, no rendered state, and no keyboard or screen-reader surface.\",\n        \"n/a\",\n        \"missing_nonfunctional_rationale\",\n    ),\n    (\n        \"outcome_contract_without_counter_metric\",\n        \"- Counter-metric: duplicate cancellation events per cancelled order, target 0.\\n\",\n        \"\",\n        \"missing_outcome_contract\",\n    ),\n    (\n        \"behavioural_criterion_absent_from_red_list\",\n        \"| AC-7 | an unknown order returns a success, so the `not_found` assertion fails |\\n\",\n        \"\",\n        \"missing_red_entry\",\n    ),\n    (\n        \"gap_without_an_owner\",\n        \"| GAP-1 | Who executes the refund after a cancellation? | product owner | non_blocking | none yet | open, excluded from this revision |\",\n        \"| GAP-1 | Who executes the refund after a cancellation? |  | non_blocking | none yet | open, excluded from this revision |\",\n        \"unowned_gap\",\n    ),\n    (\n        \"gap_blocking_effect_outside_the_agreed_set\",\n        \"| GAP-1 | Who executes the refund after a cancellation? | product owner | non_blocking | none yet | open, excluded from this revision |\",\n        \"| GAP-1 | Who executes the refund after a cancellation? | product owner | maybe later | none yet | open, excluded from this revision |\",\n        \"invalid_blocking_effect\",\n    ),\n    (\n        \"blocking_gap_left_in_a_reviewable_draft\",\n        \"| GAP-1 | Who executes the refund after a cancellation? | product owner | non_blocking | none yet | open, excluded from this revision |\",\n        \"| GAP-1 | Who executes the refund after a cancellation? | product owner | blocking | none yet | open, excluded from this revision |\",\n        \"status_conflicts_blocking_gap\",\n    ),\n    (\n        \"declared_column_renamed\",\n        \"| ID | Requirement | Polarity | Given / when / then | Counterpart | Observation point | Check |\",\n        \"| ID | Requirement | Kind | Given / when / then | Counterpart | Observation point | Check |\",\n        \"missing_column\",\n    ),\n    (\n        \"polarity_outside_the_agreed_set\",\n        \"| AC-9 | FR-5 | positive |\",\n        \"| AC-9 | FR-5 | main |\",\n        \"invalid_polarity\",\n    ),\n    (\n        \"blocked_status_without_a_blocking_gap\",\n        \"Status: `draft_for_engineer_completeness_review`\",\n        \"Status: `blocked`\",\n        \"blocked_without_blocking_gap\",\n    ),\n    (\n        \"check_type_outside_the_agreed_set\",\n        \"| AC-6 | returned outcomes, order version, and event count | behavioural_test |\",\n        \"| AC-6 | returned outcomes, order version, and event count | smoke_test |\",\n        \"invalid_check_type\",\n    ),\n)\n\n\ndef check(path: Path, shape_only: bool = False) -> dict:\n    command = [\"python3\", str(CHECKER), str(path), \"--json\"]\n    if shape_only:\n        command.append(\"--shape-only\")\n    result = subprocess.run(command, cwd=ROOT, capture_output=True, text=True)\n    if not result.stdout.strip():\n        raise AssertionError(f\"checker produced no report: {result.stderr}\")\n    report = json.loads(result.stdout)\n    report[\"exit_code\"] = result.returncode\n    return report\n\n\ndef codes(report: dict) -> list[str]:\n    return [finding[\"code\"] for finding in report[\"findings\"]]\n\n\nclass PrdContractCheckerTests(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls) -> None:\n        cls.conforming = FIXTURE.read_text()\n\n    def test_conforming_prd_satisfies_the_contract(self) -> None:\n        report = check(FIXTURE)\n        self.assertEqual([], codes(report), report[\"findings\"])\n        self.assertEqual(0, report[\"exit_code\"])\n\n    def test_each_seeded_defect_produces_its_own_finding_code(self) -> None:\n        for name, find, replace, expected in MUTATIONS:\n            with self.subTest(case=name):\n                self.assertEqual(\n                    1,\n                    self.conforming.count(find),\n                    f\"mutation {name} no longer targets exactly one place\",\n                )\n                mutated = self.conforming.replace(find, replace)\n                self.assertNotEqual(self.conforming, mutated)\n                with tempfile.TemporaryDirectory() as temp:\n                    path = Path(temp) / \"mutated.md\"\n                    path.write_text(mutated)\n                    report = check(path)\n                self.assertIn(expected, codes(report))\n                self.assertEqual(1, report[\"exit_code\"])\n\n    def test_every_finding_code_is_covered_by_a_mutation_or_a_shape_case(self) -> None:\n        report = check(FIXTURE)\n        declared = set(report[\"declared_codes\"])\n        covered = {expected for _, _, _, expected in MUTATIONS}\n        # Covered by the empty-document and blank-template cases below, not by a mutation.\n        covered.update({\"missing_section\", \"empty_table\"})\n        self.assertEqual(\n            set(),\n            declared - covered,\n            \"a declared finding code has no negative control\",\n        )\n\n    def test_a_hyphenated_blocking_effect_is_accepted(self) -> None:\n        \"\"\"A live model run wrote \"non-blocking\". The hyphen carries no meaning.\"\"\"\n        hyphenated = self.conforming.replace(\"| non_blocking |\", \"| non-blocking |\")\n        self.assertNotEqual(self.conforming, hyphenated)\n        with tempfile.TemporaryDirectory() as temp:\n            path = Path(temp) / \"hyphenated.md\"\n            path.write_text(hyphenated)\n            report = check(path)\n        self.assertEqual([], codes(report), report[\"findings\"])\n        self.assertEqual(0, report[\"exit_code\"])\n\n    def test_an_empty_document_fails_closed(self) -> None:\n        with tempfile.TemporaryDirectory() as temp:\n            path = Path(temp) / \"empty.md\"\n            path.write_text(\"# Product behaviour agreement\\n\")\n            report = check(path)\n        self.assertIn(\"missing_section\", codes(report))\n        self.assertEqual(1, report[\"exit_code\"])\n\n    def test_template_declares_every_required_section_and_column(self) -> None:\n        report = check(TEMPLATE, shape_only=True)\n        self.assertEqual([], codes(report), report[\"findings\"])\n        self.assertEqual(0, report[\"exit_code\"])\n        template = TEMPLATE.read_text()\n        for section in REQUIRED_SECTIONS:\n            self.assertIn(f\"## {section}\", template)\n\n    def test_blank_template_body_still_fails_the_full_content_contract(self) -> None:\n        report = check(TEMPLATE)\n        self.assertNotEqual(0, report[\"exit_code\"])\n        self.assertIn(\"empty_table\", codes(report))\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n", "sha256": "fa070f657ba5caedaa688f421b8a2c5b22aeecac785a52ec801e75c9355ae77d", "bytes": 9948}, "worked-example/00-intake.md": {"path": "worked-example/00-intake.md", "content": "# Worked example — intake\n\n**Work item:** SHOWCASE-OC-1\n**Status:** refined in a prepared, synthetic walkthrough\n**Owner:** fictional Order Experience product owner\n**Implementation owner:** showcase Builder role\n**Evidence class:** illustrative repository artifact; not a live agent run\n\n## Raw request\n> Allow customers to cancel an order.\n\n## Known boundary\nCustomer self-service cancellation only. Staff override, refund execution, payment reversal, inventory release, notification delivery, and deployment are excluded.\n\n## Initial unknowns\nWho may cancel; which statuses remain cancellable; what a repeat does; how stale clients behave; what concurrent requests do; and whether cancellation side effects occur once.\n\n## Source register\n\n| ID | Source | Classification | Supports |\n| --- | --- | --- | --- |\n| REQ-1 | this synthetic intake | requested | customer cancellation outcome |\n| DEC-1 | `01-decisions.md` | decided | owner, states, replay, race policy |\n| DOM-1 | `../domain/order-cancellation.md` | decided | terms and lifecycle policy |\n| TEST-1 | `../tests/test_order_cancellation.py` | observed test artifact | executable assertions |\n| IMPL-1 | `order_cancellation.py` | observed implementation artifact | teaching implementation |\n\nAbsence of a payment or notification source is recorded as an exclusion/unknown, not evidence that those concerns do not exist.\n", "sha256": "8f693d8a7fe79d8a43c24cf647521915ef4aabd519b948cd1c86886aa998a4da", "bytes": 1382}, "worked-example/01-decisions.md": {"path": "worked-example/01-decisions.md", "content": "# Capture & Refine decision record\n\n**Status:** agreed for synthetic example\n**Decision owner:** fictional Order Experience product owner\n**Engineer reviewer:** showcase engineering role\n**Applies to:** SHOWCASE-OC-1 revision 1\n\n| ID | Atomic question | Decision | Why it matters |\n| --- | --- | --- | --- |\n| D1 | Who may use this route? | Only the owning customer. | Prevents one customer changing another's order. |\n| D2 | Which states are cancellable? | `placed` and `confirmed`. | Defines the fulfilment cutoff. |\n| D3 | What happens after fulfilment starts? | Return `too_late`; preserve status. | Makes the race outcome visible and safe. |\n| D4 | What does exact retry do? | Return the original result; no second event. | Supports retry after an unknown response. |\n| D5 | Can one key identify different requests? | No; raise an idempotency conflict. | Prevents accidental result aliasing. |\n| D6 | What does a new key do after cancellation? | Return `already_cancelled`; no second event, even if that later intent supplies a stale expected version. | Keeps the completed, human-visible outcome authoritative and repeated intent harmless. |\n| D7 | How is a stale client handled? | For an order not already cancelled, an optional expected version mismatch returns `version_conflict`. | Prevents mutation from stale state while preserving D6 precedence. |\n| D8 | What if valid requests race? | Exactly one transition and one cancellation event. | Defines the atomicity invariant. |\n\n## Open product decisions excluded from build\nRefund timing, payment reversal, stock release, customer notification, support override, privacy-preserving error disclosure, and production service levels. A real feature cannot claim end-to-end cancellation until owners decide these matters.\n", "sha256": "e6a5c8fe9711b0a7cf62b557fbe95a2a8a0b1f0c537675f0b753222880ae6e6c", "bytes": 1778}, "worked-example/02-prd.md": {"path": "worked-example/02-prd.md", "content": "# PRD — customer order cancellation\n\n**Work item:** SHOWCASE-OC-1\n**Status:** APPROVED FOR SYNTHETIC EXAMPLE\n**Revision:** 1\n**Owner:** fictional Order Experience product owner\n\n## Outcome\nAn owning customer can stop an order before fulfilment begins and can safely retry without creating duplicate cancellation effects.\n\n## Scope\nIn: customer action, ownership check, lifecycle cutoff, expected-version check, request-key replay, one cancellation event. Out: payment/refund, inventory, notifications, staff override, persistence, APIs, deployment.\n\n## Requirements\n- **FR-1 [REQ-1, D1, D2]:** The owning customer may cancel an order in `placed` or `confirmed`.\n- **FR-2 [D3]:** An order at `fulfilment_started` or `shipped` remains unchanged and returns `too_late`.\n- **FR-3 [D4, D5, D6]:** Exact request replay returns its original result; key misuse conflicts; later intent does not duplicate the event. For an already-cancelled order, `already_cancelled` takes precedence over a stale expected version.\n- **FR-4 [D7]:** For an order not already cancelled, a supplied stale expected version returns `version_conflict` without mutation.\n- **FR-5 [D8]:** Concurrent valid attempts cause one transition and one event.\n\n## Acceptance criteria\n- **AC-1:** Given an owned confirmed order, when its owner cancels at version 1, then status is `cancelled`, version is 2, and one event exists.\n- **AC-2:** Given an order owned by someone else, when an actor requests cancellation, then result is `not_owner` and state/events do not change.\n- **AC-3:** Given fulfilment has started, when the owner requests cancellation, then result is `too_late` and state/events do not change.\n- **AC-4:** Given a completed request, when its exact key and request are retried, then the original result is returned and no additional event exists.\n- **AC-5:** Given a used key, when a different request reuses it, then the call reports an idempotency conflict.\n- **AC-6:** Given a cancelled order, when a new request key is used, then result is `already_cancelled` and no additional event exists, including when the later request supplies the pre-cancellation expected version.\n- **AC-7:** Given an unknown order, cancellation returns `not_found` with no event.\n- **AC-8:** Given expected version 99 and actual version 1, cancellation returns `version_conflict` without mutation.\n- **AC-9:** Given twelve simultaneous valid attempts, exactly one returns `cancelled`, eleven return `already_cancelled`, one event exists, and version increments once.\n\n## Approval boundary\nThis approval is fictional metadata for the worked example. It does not authenticate a person or authorize production implementation.\n", "sha256": "0b26ee41d10054da8e5ee5f7d35be4618b0a2f4b7231f89052127e57e62292ca", "bytes": 2682}, "worked-example/03-design.md": {"path": "worked-example/03-design.md", "content": "# Design specification — cancellation states\n\n**Status:** ready for synthetic example\n**Bound to:** SHOWCASE-OC-1 PRD revision 1\n**Owner:** showcase Design role\n\n| State | Visible behaviour | Action/focus/accessibility |\n| --- | --- | --- |\n| Eligible | “Cancel order” available to owner. | Button is keyboard reachable and named with order context. |\n| Confirm | Explain cancellation cutoff and consequence. | Initial focus on heading; Cancel and Keep order are distinct. |\n| Pending | “Cancelling order…” | Disable repeat activation; announce polite progress. |\n| Success | “Order cancelled.” | Focus status heading; announce success once. |\n| Too late | “Fulfilment has started; this order can no longer be cancelled.” | Preserve order; offer fulfilment help route. |\n| Already cancelled | “This order is already cancelled.” This completed outcome is shown instead of a stale-version warning. | No destructive action; show current status. |\n| Not owner/not found | The teaching harness exposes typed codes, not customer copy. | Production disclosure policy remains unresolved. |\n| Version conflict | “Order changed. Refresh and review its current status.” | Focus message, offer refresh. |\n| Unknown transport result | “We could not confirm the result. Retry is safe.” | Retry reuses the same request key. |\n\n## Readiness decision\nThe states needed by the executable example are represented. Payment/refund, offline persistence, responsive visuals, localization, and production error-disclosure copy are excluded, so this is not production design readiness.\n", "sha256": "47f9ca4b30ef437c628ea28c8ddd11e2c22aa7f7836a484bc85884e40ce853f0", "bytes": 1593}, "worked-example/04-plan.md": {"path": "worked-example/04-plan.md", "content": "# Technical plan\n\n**Status:** implemented for teaching example\n**Inputs:** PRD revision 1 and design specification\n\n## Invariants\n- Only owner can mutate.\n- Only `placed`/`confirmed` can transition.\n- Mutation increments version once.\n- One accepted transition appends one cancellation event.\n- Same key and fingerprint replay exactly; different fingerprint conflicts.\n- Version and lifecycle checks occur inside the mutation lock.\n\n## Tasks and proof\n1. Define typed order statuses, result codes, immutable records, and store. Proof: import through test suite.\n2. Implement lock-scoped replay, checks, transition, event append, and result recording. Proof: AC-1–AC-8 tests.\n3. Synchronize twelve callers and assert exactly-once state/event invariant. Proof: AC-9.\n4. Preserve the historical missing-implementation RED, a reproducible semantic idempotency negative control, and final GREEN. Proof: `evidence/red.txt`, `evidence/semantic-red.txt`, its reproducer, and `evidence/green.txt`.\n\n## Atomic boundary\nThe in-memory store owns one re-entrant lock. The idempotency lookup, state read, checks, write, event append, and result record execute while holding it. This is deterministic for threads sharing that store.\n\n## Production delta\nReplace process memory with a durable transaction; enforce request-key uniqueness in storage; use optimistic version or row locking; write an outbox row in the same transaction; publish and acknowledge separately; make consumers idempotent; test crash points and multi-worker races; add reconciliation and observability.\n\n## Rollback\nThe example has no deployment or migration. A production rollback must not reverse already accepted cancellations blindly; it would require compatibility and reconciliation planning.\n", "sha256": "9a8c45e1ffc076e586d6db9cd98227ff4fb952134a929a675b4f79714b0a96f4", "bytes": 1758}, "worked-example/05-review.md": {"path": "worked-example/05-review.md", "content": "# Independent-style review record\n\n**Target:** repository revision and evidence identities recorded in `evidence/`\n**Status:** MERGE CANDIDATE FOR EDUCATIONAL USE\n**Reviewer stance:** adversarial evidence review, not a live product approval\n\n## Findings\n- The PRD criteria map to twelve executable tests and explicit implementation branches, including direct `placed`, `shipped`, and completed-cancellation/stale-version precedence cases.\n- The historical import RED only demonstrates detection of a completely missing implementation. The separate semantic negative control mutates exact replay and demonstrates that the idempotency assertion fails; GREEN shows the unmutated implementation passes all twelve behavior tests.\n- Ownership, status cutoff, expected version, request replay, key misuse, repeated intent, and a synchronized same-process race are asserted.\n- The lock encloses state update, event append, and idempotency record, so the tested one-process invariant is coherent.\n\n## Confidence boundaries\nThis does not prove database durability, multi-process exclusion, crash recovery, message-broker delivery, consumer deduplication, payment/refund behavior, security posture, performance, deployment, rollback, or production authorization. “Exactly once” here means one event object appended to one in-memory list under one lock, not exactly-once distributed delivery.\n\n## Decision\nSuitable as a runnable masterclass example with the above caveats displayed. Not suitable as a production reference architecture without the production delta in `04-plan.md`.\n", "sha256": "4775e451119ec45ecd3e52f1fb8e653f3b563ce5d7b68e511c3c727f9048814b", "bytes": 1573}, "worked-example/06-curation.md": {"path": "worked-example/06-curation.md", "content": "# Curation record\n\n**Status:** proposed learning set\n**Owners:** skill maintainer, fictional domain owner, and product backlog owner respectively\n\n| Finding | Classification | Destination | Status |\n| --- | --- | --- | --- |\n| Repeated actions need a request-identity decision. | reusable method | Capture & Refine skill | accepted in this pack |\n| Race questions must name side effects that occur once. | reusable method | Planner/Tester skills | accepted in this pack |\n| `placed` and `confirmed` are cancellable. | illustrative domain policy | domain context | accepted only for example v1 |\n| Durable outbox and unique key constraint are needed for a production candidate. | engineering proposal | future product plan | proposed, not implemented |\n| Payment/refund coupling remains undecided. | product gap | future Capture & Refine pass | open |\n\n## Next-use check\nOn the next state-changing feature, verify the refinement record asks both “what identifies a retry?” and “what happens when valid requests race?” Then inspect whether acceptance criteria cover state and side effects, not only response codes.\n", "sha256": "fac2ff384321fcfeee6dcb22e06a13e176b64d0a178b5221e64bc759d59b6b01", "bytes": 1121}, "worked-example/evidence/green.txt": {"path": "worked-example/evidence/green.txt", "content": "GREEN evidence — final implementation and content contract\nCaptured: 2026-09-16T12:50:13Z\nRuntime: Python 3.9.6\nCommand: python3 -m unittest discover -s tests -v\nExit code: 0\n\nThe final executed output is reproduced in `verification.txt`; it reports 16 tests and `OK`.\n\nInterpretation: the current repository passes twelve order-cancellation behavior tests and four repository content-contract tests. This does not extend beyond the claim boundaries in `docs/traceability.md`.\n", "sha256": "f24dca145550c9f0159d110e004730f384b74fcbe86ebaf19c0120834525f200", "bytes": 479}, "worked-example/evidence/red.txt": {"path": "worked-example/evidence/red.txt", "content": "RED evidence — before implementation\nCaptured: 2026-09-16T12:32:34Z session (pre-implementation run occurred earlier in the same work session)\nCommand: python3 -m unittest discover -s tests -v\nExit code: 1\n\nSanitized command output (machine-specific absolute frame path replaced by repository-relative path):\n\ntest_order_cancellation (unittest.loader._FailedTest) ... ERROR\n\n======================================================================\nERROR: test_order_cancellation (unittest.loader._FailedTest)\n----------------------------------------------------------------------\nImportError: Failed to import test module: test_order_cancellation\nTraceback (most recent call last):\n  File \"tests/test_order_cancellation.py\", line 12, in <module>\n    from order_cancellation import (\nModuleNotFoundError: No module named 'order_cancellation'\n\n----------------------------------------------------------------------\nRan 1 test in 0.000s\n\nFAILED (errors=1)\n\nInterpretation: the executable example was absent, so the test suite could not import it. This is a causal RED for the subsequent implementation, not a seeded product defect.\n", "sha256": "ea4de0ad80bd6068bdbec866ddeabbdc54adb72ccdaa91a73e3ea91ed16c8947", "bytes": 1129}, "worked-example/evidence/reproduce_idempotency_negative_control.py": {"path": "worked-example/evidence/reproduce_idempotency_negative_control.py", "content": "#!/usr/bin/env python3\n\"\"\"Run a disposable semantic mutation against exact-replay idempotency.\n\nThe repository is never edited. The script copies the implementation to a\ntemporary directory, removes the successful prior-result return, and runs one\nfocused unittest that must fail. Exit 1 is the expected RED result.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport subprocess\nimport sys\nimport tempfile\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\nSOURCE = ROOT / \"worked-example\" / \"order_cancellation.py\"\nORIGINAL = \"                return prior_result\\n\"\nMUTATED = \"                # NEGATIVE CONTROL: do not replay prior_result\\n\"\nTEST = '''\\\nimport unittest\nfrom order_cancellation import InMemoryOrderStore, Order, OrderCancellationService, OrderStatus\n\n\nclass ExactReplayNegativeControl(unittest.TestCase):\n    def test_exact_retry_returns_original_result(self):\n        store = InMemoryOrderStore([\n            Order(order_id=\"ORD-NC-1\", owner_id=\"customer-nc\", status=OrderStatus.CONFIRMED)\n        ])\n        service = OrderCancellationService(store)\n        first = service.cancel(\"ORD-NC-1\", \"customer-nc\", \"req-nc\")\n        replay = service.cancel(\"ORD-NC-1\", \"customer-nc\", \"req-nc\")\n        self.assertEqual(first, replay)\n        self.assertEqual(1, len(store.events))\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n'''\n\n\ndef main() -> int:\n    source = SOURCE.read_text()\n    if source.count(ORIGINAL) != 1:\n        print(\"Refusing to run: exact replay statement was not found uniquely.\", file=sys.stderr)\n        return 2\n\n    with temp --------------------------------------------------------------------\nTraceback (most recent call last):\n  File \"test_negative_control.py\", line 13, in test_exact_retry_returns_original_result\n    self.assertEqual(first, replay)\nAssertionError: Cance[53 chars]Code.CANCELLED: 'cancelled'>, order_status=<Or[46 chars]on=2) != Cance[53 chars]Code.ALREADY_CANCELLED: 'already_cancelled'>, [62 chars]on=2)\n\n----------------------------------------------------------------------\nRan 1 test in 0.000s\n\nFAILED (failures=1)\n\nInterpretation: this semantic RED demonstrates that the exact-replay assertion detects loss of the idempotency return guarantee. It is separate from red.txt, which only records the historical missing-module/import failure.\n", "sha256": "db66f1ed8756e2dfb19f0baee213d2c45ba460ba7fffdd1c148172f837f1e544", "bytes": 1731}, "worked-example/evidence/verification.txt": {"path": "worked-example/evidence/verification.txt", "content": "Final verification receipt\nCaptured: 2026-09-16T12:50:13Z\nRuntime: Python 3.9.6\nCommand: python3 -m unittest discover -s tests -v\nExit code: 0\n\ntest_all_roles_exist_in_required_order_and_define_contract (test_content_contract.ContentContractTests) ... ok\ntest_domain_policy_is_separate_from_skills (test_content_contract.ContentContractTests) ... ok\ntest_each_role_has_a_substantive_separate_skill (test_content_contract.ContentContractTests) ... ok\ntest_public_material_has_no_private_or_absolute_path_markers (test_content_contract.ContentContractTests) ... ok\ntest_already_cancelled_precedes_stale_version_for_new_intent (test_order_cancellation.OrderCancellationTests) ... ok\ntest_concurrent_requests_emit_exactly_one_cancellation_event (test_order_cancellation.OrderCancellationTests) ... ok\ntest_fulfilment_started_is_too_late (test_order_cancellation.OrderCancellationTests) ... ok\ntest_new_key_after_cancellation_reports_existing_outcome (test_order_cancellation.OrderCancellationTests) ... ok\ntest_non_owner_is_refused_without_mutation (test_order_cancellation.OrderCancellationTests) ... ok\ntest_owner_can_cancel_before_fulfilment (test_order_cancellation.OrderCancellationTests) ... ok\ntest_owner_can_cancel_placed_order (test_order_cancellation.OrderCancellationTests) ... ok\ntest_reusing_key_for_different_request_is_a_conflict (test_order_cancellation.OrderCancellationTests) ... ok\ntest_same_idempotency_key_replays_result_without_second_event (test_order_cancellation.OrderCancellationTests) ... ok\ntest_shipped_is_too_late (test_order_cancellation.OrderCancellationTests) ... ok\ntest_stale_expected_version_is_rejected (test_order_cancellation.OrderCancellationTests) ... ok\ntest_unknown_order_is_not_found (test_order_cancellation.OrderCancellationTests) ... ok\n\n----------------------------------------------------------------------\nRan 16 tests in 0.005s\n\nOK\n", "sha256": "4c9d2239437711754edad1c1a5052da75ee59c70c29edbae900b28c8871c22c0", "bytes": 1879}, "worked-example/order_cancellation.py": {"path": "worked-example/order_cancellation.py", "content": "\"\"\"Executable, dependency-free order-cancellation reference example.\n\nThis is an in-process teaching implementation, not a production service. The\nstore's single re-entrant lock makes the order mutation, event append, and\nidempotency record atomic only inside one Python process.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, replace\nfrom enum import Enum\nfrom threading import RLock\nfrom typing import Dict, Iterable, List, Optional, Tuple\n\n\nclass OrderStatus(str, Enum):\n    PLACED = \"placed\"\n    CONFIRMED = \"confirmed\"\n    FULFILMENT_STARTED = \"fulfilment_started\"\n    SHIPPED = \"shipped\"\n    CANCELLED = \"cancelled\"\n\n\nclass CancellationCode(str, Enum):\n    CANCELLED = \"cancelled\"\n    ALREADY_CANCELLED = \"already_cancelled\"\n    NOT_FOUND = \"not_found\"\n    NOT_OWNER = \"not_owner\"\n    TOO_LATE = \"too_late\"\n    VERSION_CONFLICT = \"version_conflict\"\n\n\nclass IdempotencyConflict(ValueError):\n    \"\"\"Raised when one idempotency key is reused for a different request.\"\"\"\n\n\n@dataclass(frozen=True)\nclass Order:\n    order_id: str\n    owner_id: str\n    status: OrderStatus\n    version: int = 1\n\n\n@dataclass(frozen=True)\nclass CancellationEvent:\n    order_id: str\n    resulting_version: int\n    event_type: str = \"order.cancelled\"\n\n\n@dataclass(frozen=True)\nclass CancellationResult:\n    order_id: str\n    code: CancellationCode\n    order_status: Optional[OrderStatus]\n    order_version: Optional[int]\n\n\nRequestFingerprint = Tuple[str, str, Optional[int]]\nIdempotencyRecord = Tuple[RequestFingerprint, CancellationResult]\n\n\nclass InMemoryOrderStore:\n    \"\"\"Owns state and the lock defining the example's atomic boundary.\"\"\"\n\n    def __init__(self, orders: Iterable[Order] = ()) -> None:\n        materialized = list(orders)\n        self._orders: Dict[str, Order] = {order.order_id: order for order in materialized}\n        if len(self._orders) != len(materialized):\n            raise ValueError(\"order identifiers must be unique\")\n        self._idempotency: Dict[str, IdempotencyRecord] = {}\n        self.events: List[CancellationEvent] = []\n        self.lock = RLock()\n\n    def get(self, order_id: str) -> Optional[Order]:\n        with self.lock:\n            return self._orders.get(order_id)\n\n    def _put_locked(self, order: Order) -> None:\n        self._orders[order.order_id] = order\n\n    def _idempotency_locked(self, key: str) -> Optional[IdempotencyRecord]:\n        return self._idempotency.get(key)\n\n    def _remember_locked(\n        self,\n        key: str,\n        fingerprint: RequestFingerprint,\n        result: CancellationResult,\n    ) -> None:\n        self._idempotency[key] = (fingerprint, result)\n\n\nclass OrderCancellationService:\n    CANCELLABLE_STATUSES = frozenset({OrderStatus.PLACED, OrderStatus.CONFIRMED})\n\n    def __init__(self, store: InMemoryOrderStore) -> None:\n        self.store = store\n\n    def cancel(\n        self,\n        order_id: str,\n        actor_id: str,\n        idempotency_key: str,\n        *,\n        expected_version: Optional[int] = None,\n    ) -> CancellationResult:\n        if not order_id or not actor_id or not idempotency_key:\n            raise ValueError(\"order_id, actor_id, and idempotency_key are required\")\n\n        fingerprint = (order_id, actor_id, expected_version)\n        with self.store.lock:\n            prior = self.store._idempotency_locked(idempotency_key)\n            if prior is not None:\n                prior_fingerprint, prior_result = prior\n                if prior_fingerprint != fingerprint:\n                    raise IdempotencyConflict(\n                        \"idempotency key already belongs to a different cancellation request\"\n                    )\n                return prior_result\n\n            order = self.store._orders.get(order_id)\n            result = self._decide(order_id, order, actor_id, expected_version)\n\n            if result.code is CancellationCode.CANCELLED:\n                assert order is not None\n                updated = replace(order, status=OrderStatus.CANCELLED, version=order.version + 1)\n                self.store._put_locked(updated)\n                self.store.events.append(\n                    CancellationEvent(order_id=updated.order_id, resulting_version=updated.version)\n                )\n                result = CancellationResult(\n                    order_id=updated.order_id,\n                    code=CancellationCode.CANCELLED,\n                    order_status=updated.status,\n                    order_version=updated.version,\n                )\n\n            self.store._remember_locked(idempotency_key, fingerprint, result)\n            return result\n\n    def _decide(\n        self,\n        order_id: str,\n        order: Optional[Order],\n        actor_id: str,\n        expected_version: Optional[int],\n    ) -> CancellationResult:\n        if order is None:\n            return CancellationResult(order_id, CancellationCode.NOT_FOUND, None, None)\n        if order.owner_id != actor_id:\n            return self._result(order, CancellationCode.NOT_OWNER)\n        # A completed cancellation is the human-visible outcome even when a\n        # later intent carries a stale version. No write is still attempted.\n        if order.status is OrderStatus.CANCELLED:\n            return self._result(order, CancellationCode.ALREADY_CANCELLED)\n        if expected_version is not None and expected_version != order.version:\n            return self._result(order, CancellationCode.VERSION_CONFLICT)\n        if order.status not in self.CANCELLABLE_STATUSES:\n            return self._result(order, CancellationCode.TOO_LATE)\n        return self._result(order, CancellationCode.CANCELLED)\n\n    @staticmethod\n    def _result(order: Order, code: CancellationCode) -> CancellationResult:\n        return CancellationResult(order.order_id, code, order.status, order.version)\n", "sha256": "15f51a27afe8e5401b005a5d330713bbb0a89cab12136ce9e93dbcfc1f0c076b", "bytes": 5794}}, "missing": []}</script>
<script>
(()=>{'use strict';const DATA=JSON.parse(document.getElementById('masterclass-data').textContent),X=DATA.experience,S=X.scenes,R=X.roles,F=DATA.files;let i=0,lastFocus=null;

X.acts.forEach((a,n)=>{const b=document.createElement('button');b.className='act';b.dataset.act=n;b.dataset.control='act-'+(n+1);b.textContent=(n+1)+' / '+a;b.onclick=()=>go(S.findIndex(s=>s.act===n));acts.appendChild(b)});
function go(n,push=true){i=Math.max(0,Math.min(S.length-1,n));document.querySelectorAll('.scene').forEach((e,k)=>{e.classList.toggle('active',k===i);e.setAttribute('aria-hidden',k===i?'false':'true')});document.querySelectorAll('.role').forEach(e=>e.setAttribute('aria-current',e.dataset.role===S[i].role?'true':'false'));document.querySelectorAll('.act').forEach(e=>e.classList.toggle('active',+e.dataset.act===S[i].act));$('back').disabled=i===0;$('next').disabled=i===S.length-1;$('count').textContent=`${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}`;$('announce').textContent=`Scene ${i+1}: ${S[i].title}`;if(push)history.replaceState(null,'','#'+S[i].id)}
$('next').onclick=()=>go(i+1);$('back').onclick=()=>go(i-1);$('reset').onclick=()=>go(0);
function candidateFiles(){const role=R.find(r=>r.id===S[i].role),preferred=[];if(role)preferred.push(role.roleFile,role.skillFile);X.artifacts.forEach(a=>preferred.push(a.path));return [...new Set([...preferred,...Object.keys(F)])].filter(p=>F[p])}

function openDrawer(){lastFocus=document.activeElement;const paths=candidateFiles().length?candidateFiles():Object.keys(F);$('fileTabs').innerHTML='';paths.forEach((p,n)=>{const b=document.createElement('button');b.className='file-tab';b.dataset.path=p;b.setAttribute('role','tab');b.textContent=p;b.onclick=()=>showFile(p);$('fileTabs').appendChild(b)});$('drawer').classList.add('open');$('drawer').removeAttribute('inert');$('drawer').setAttribute('aria-hidden','false');if(paths[0])showFile(paths[0]);else{$('fileView').textContent='Source files were not present at build time. Rebuild with --source-root after the repository content is available.';$('fileMeta').textContent=DATA.missing.length+' expected files unavailable';}$('closeFiles').focus()}
function closeDrawer(){$('drawer').classList.remove('open');$('drawer').setAttribute('aria-hidden','true');$('drawer').setAttribute('inert','');if(lastFocus)lastFocus.focus()}$('openFiles').onclick=openDrawer;$('closeFiles').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if($('drawer').classList.contains('open')){if(e.key==='Escape'){closeDrawer();return}if(e.key==='Tab'){const focusable=[...$('drawer').querySelectorAll('button,a[href],[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(['ArrowRight','PageDown'].includes(e.key)||(e.key===' '&&!/BUTTON|A/.test(e.target.tagName))){e.preventDefault();go(i+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(i-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key.toLowerCase()==='f')openDrawer()});
