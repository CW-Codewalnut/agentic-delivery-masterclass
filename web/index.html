e + local evidence"], ["STOP", "Requirement or plan contradiction"]], "takeaway": "The Builder does not silently resolve product ambiguity in code.", "notes": "Use the worked-example file if present; label all example artefacts as prepared."}, {"id": "tester", "act": 3, "role": "tester", "kind": "handoff", "kicker": "05 / TESTER", "title": "Evidence answers a claim — not every possible question.", "lede": "Verification links observed results to the current change, environment and acceptance criteria.", "items": [["INPUT", "Change + acceptance"], ["WORK", "Exercise happy, refusal, repeat and failure paths"], ["OUTPUT", "Results + gaps + provenance"], ["STOP", "Environment cannot support the claim"]], "takeaway": "Not run is not passed. Old evidence does not prove the current change.", "notes": "Do not invent execution results. Open repository evidence only when present."}, {"id": "reviewer", "act": 4, "role": "reviewer", "kind": "confidence", "kicker": "06 / REVIEWER · HONEST MODEL", "title": "Why should we trust this change?", "lede": "Review brings intent, change, evidence and open concerns into one bounded decision. The NFR X-ray and merge score are aspirational here, not runnable proof.", "items": [["SUPPORTED", "Current evidence supports the scoped claim."], ["UNASSESSED", "No conclusion: missing, unavailable or outside scope."], ["STALE", "The evidence belongs to an older change or baseline."]], "takeaway": "Leadership needs the basis for confidence — not a fabricated product score.", "notes": "Land: merge confidence is not release confidence. Do not imply an NFR X-ray or merge score was executed."}, {"id": "boundaries", "act": 4, "role": "reviewer", "kind": "split", "kicker": "DECISION BOUNDARIES", "title": "Ready to merge is not ready to release.", "lede": "Related evidence supports different decisions.", "items": [["MERGE", "Can this enter the codebase?", "Scoped behaviour · review findings · relevant tests · known limitations"], ["RELEASE", "Can users safely receive it?", "Integrations · configuration · deployment · rollback · operations"]], "takeaway": "A reviewed change is not a blanket guarantee about the production system.", "notes": "No product score is shown; no release claim is made."}, {"id": "curator", "act": 4, "role": "curator", "kind": "flow", "kicker": "07 / CURATOR", "title": "One finding can improve three different things.", "lede": "Keep reusable capability, product knowledge and delivery work separate — then review each change.", "items": [["SKILL", "Ask about repeats", "A reusable refinement question."], ["DOMAIN", "Record the rule", "A human-approved product decision."], ["PRODUCT", "Propose a fix", "A separately scoped delivery change."], ["RECHECK", "Next change", "Did the recurring issue improve?"]], "takeaway": "The loop closes only when learning changes a later decision or delivery outcome.", "notes": "Show: Curator source files. Land: version, review, maintain and recheck."}, {"id": "controls", "act": 5, "role": null, "kind": "split", "kicker": "CONTROLLED ADOPTION", "title": "Scale the method — not uncontrolled access.", "lede": "Good output, permission to act and worthwhile economics are separate things to establish.", "items": [["BOUNDED AUTHORITY", "Read · propose · record", "Permitted repositories and data · approved tools · traceable decisions"], ["EXPLICIT APPROVAL", "Higher-impact actions", "Credentials · permissions · production data · merge · release · deployment"]], "takeaway": "Permission to inspect a repository does not imply permission to deploy.", "notes": "No claim of enterprise adoption. This is an operating pattern for evaluation."}, {"id": "adoption", "act": 5, "role": null, "kind": "flow", "kicker": "START SMALL", "title": "Adopt around one bottleneck, then inspect the result.", "lede": "Use a real feature, real owners and explicit evidence boundaries before expanding.", "items": [["CHOOSE", "One bottleneck", "A recurring, consequential delivery problem."], ["BOUND", "One feature", "Named owners, permissions and approval gates."], ["OBSERVE", "Accepted work", "Spend, human effort, elapsed time, quality and rework."], ["DECIDE", "Expand or stop", "Use observed outcomes, not enthusiasm."]], "takeaway": "The objective is a better accepted outcome — not the cheapest first answer.", "notes": "The free 90-minute masterclass refers to the overall event. This contribution’s working 50-minute slot remains provisional. Do not imply a human rehearsal occurred."}, {"id": "close", "act": 5, "role": null, "kind": "hero", "kicker": "THE NEXT CHANGE", "title": "Start with one bottleneck. Improve the next change.", "lede": "The same request is now agreed, designed, planned, built, tested, reviewed and curated through accountable handoffs.", "quote": "Intent → delivery → evidence → learning", "takeaway": "Every feature can improve the product, the domain understanding and the capability used next time.", "notes": "Reset returns to the opening. Recovery: PDF and PPTX carry the same scene sequence offline."}]}, "files": {"roles/01-capture-refine.md": {"path": "roles/01-capture-refine.md", "content": "# 01 — Capture & Refine\n\n## Mission\nTurn an incomplete product request into a concise, evidence-linked agreement about observable behaviour. This role resolves product ambiguity; it does not plan or implement the change.\n\n## Starts with\n- a stable work-item identifier, bounded product area, and raw request;\n- accessible product documents, designs, behavioural tests, or history;\n- named product and engineering decision owners; and\n- explicit access limits and unavailable sources.\n\n## Method\n1. Inventory each source with a stable locator and classify statements as **requested**, **observed**, **decided**, **conflicting**, or **unknown**.\n2. Map actors, permissions, states, transitions, validation, errors, retry, cancellation, offline behaviour, accessibility, and measurable quality expectations.\n3. Ask atomic frontier questions. One question covers one decision; never fill a human-owned gap with a plausible answer.\n4. Record decisions with owner and rationale, then produce acceptance criteria that describe visible outcomes.\n5. Bind engineer review and product approval to the exact PRD revision. Evaluate design readiness only after approval.\n\n## Produces\n- source and evidence register;\n- open-decision log and product decision record;\n- approved, revisioned PRD with acceptance criteria;\n- design-readiness result; and\n- one bounded handoff: **Design** if design is absent, incomplete, conflicting, or unknown; otherwise **Planner**.\n\n## Ownership and status\nCapture & Refine owns the meaning of `draft`, `blocked`, and `approved` for the PRD. Product owns policy decisions and approval; engineering confirms feasibility questions were surfaced, not that the product decision is correct. A repository fixture can demonstrate traceability but cannot authenticate an approver.\n\n## Stop gates\nStop with no handoff when required input is missing, evidence is inaccessible and material, a decision remains open, engineer review requests changes, product approval is absent, or the approval does not identify the exact revision. Never route directly to Builder.\n\n## Worked-example checkpoint\nThe phrase “customers can cancel an order” is not enough. The role asks who may cancel, the latest cancellable status, what repeated requests do, and which outcome appears when fulfilment wins a race. The agreed example says the owning customer may cancel only in `placed` or `confirmed`; one accepted cancellation emits one event; later attempts report the existing outcome.\n\n## Limits\nNo code edits, architecture choices, task breakdown, test execution, or live-agent claim. The output is an inspectable agreement prepared for the next role.\n", "sha256": "b870afd917d32f2c7130ff96aa4345d75d1d749fb6abec624f6773979cc86d9f", "bytes": 2652}, "skills/capture-refine/SKILL.md": {"path": "skills/capture-refine/SKILL.md", "content": "---\nname: capture-refine\ndescription: Use when a vague product request needs a testable agreement.\nversion: 1.0.0\n---\n# Capture and refine product intent\n\n## Purpose and boundary\nProduce an approved behavioural contract from incomplete intent. Do not choose architecture, write code, create technical tasks, or infer approval.\n\n## Inputs\n- Stable work-item ID, raw request, product boundary, product owner, engineer reviewer.\n- Accessible requirements, design, behaviour tests, prior decisions, screenshots, or history.\n- Source locators and access limitations.\n\n## Steps\n1. Create a source register. Label each claim `requested`, `observed`, `decided`, `conflicting`, or `unknown`; a missing source is not evidence of absence.\n2. Write the actor, desired outcome, explicit exclusions, and domain terms.\n3. Build a decision tree across permission, lifecycle state, validation, failure, retry, repeated action, concurrency, accessibility, and measurable qualities.\n4. Ask only the current frontier. Each numbered question must be independently answerable. Include a product-level recommendation and trade-off, not a technical design.\n5. Record each answer with decision owner and locator. Keep unanswered branches open; never manufacture an answer.\n6. Draft functional requirements and Given/When/Then criteria. Give every material clause evidence or a decision reference.\n7. Obtain engineer review, then explicit product decision (`approved`, `changes_requested`, or `pending`) bound to the exact revision.\n8. Evaluate design readiness. Route to Design unless a version-aligned design covers all applicable states and is marked ready; otherwise route to Planner. Never route directly to Builder.\n\n## Outputs\nSource register, decision log, revisioned PRD, acceptance criteria, review records, design gate, and one bounded handoff or refusal.\n\n## Stop gates\nStop for missing required input, inaccessible material evidence, open decisions, unsupported clauses, requested changes, absent exact-revision approval, or inconsistent design evidence.\n\n## Example\nInput: “Customers can cancel orders.” Question: “Which lifecycle states remain cancellable?” Product decision: `placed` and `confirmed`; once fulfilment starts, show `too_late`. Output criterion: “Given an owned confirmed order, when its owner cancels it, then status becomes cancelled and one cancellation event is recorded.”\n\n## Quality check\nA reader can distinguish facts, requests, decisions, and unknowns; every criterion is observable; status and owner are explicit; no implementation prescription is hidden in the PRD.\n", "sha256": "00ba8911346f712418a45c6fb03c4eea2cc33c75607b417e7b1d3025a6a83fc1", "bytes": 2593}, "roles/02-design.md": {"path": "roles/02-design.md", "content": "# 02 — Design\n\n## Mission\nTranslate an approved product agreement into a reviewable interaction specification covering every relevant user-visible state before implementation planning begins.\n\n## Starts with\n- the exact approved PRD revision and its evidence register;\n- unresolved design questions explicitly marked as such;\n- product design standards and accessibility constraints; and\n- a named designer and product decision owner.\n\n## Method\n1. Confirm the PRD revision and reject stale or unapproved input.\n2. Model the journey from entry point through initial, loading, success, empty, invalid, failure, retry, cancellation, permission-denied, and offline states as applicable.\n3. Specify content, interaction, focus order, announcements, destructive-action safeguards, and recovery paths.\n4. Link each design decision to a requirement or raise a product question back to Capture & Refine.\n5. Conduct design review and record covered states, open gaps, owner, decision, and revision.\n\n## Produces\n- state model and interaction notes;\n- accessible content and behaviour specification;\n- design decision log and coverage matrix; and\n- `ready`, `incomplete`, `conflicting`, or `blocked` design status bound to the PRD revision.\n\n## Ownership and status\nDesign owns interaction intent and design readiness. Product owns any changed policy. Planner may consume only `ready`; `incomplete` or `conflicting` remains with Design or returns to Capture & Refine if product intent changed.\n\n## Stop gates\nStop when the PRD is unapproved or stale, a material product decision is missing, relevant failure/accessibility states are unspecified, or two sources conflict. Do not silently invent policy and do not produce engineering tasks.\n\n## Worked-example checkpoint\nFor order cancellation, the confirmation explains the cutoff, the pending state disables repeat activation, success announces cancellation, `too_late` preserves the order and points to fulfilment help, and an unknown outcome permits a safe retry with the same request key.\n\n## Limits\nA design-ready decision is not implementation approval, test evidence, or proof that the interface works. It is a version-bound design contract handed to Planner.\n", "sha256": "44dea710adacb2659e2baa24153a60fe84d1f4cc1165b75637d82e713dec5ee3", "bytes": 2208}, "skills/design/SKILL.md": {"path": "skills/design/SKILL.md", "content": "---\nname: design\ndescription: Use when approved behaviour needs complete interaction states.\nversion: 1.0.0\n---\n# Design a state-complete interaction\n\n## Purpose and boundary\nTurn an approved PRD into a state-complete, accessible interaction specification. Do not alter product policy or create engineering tasks.\n\n## Inputs\nApproved PRD revision, evidence register, domain context, design standards, supported platforms, and named design/product owners.\n\n## Steps\n1. Verify approval and revision identity. Reject a stale or unsigned PRD.\n2. Map entry, confirmation, pending, success, empty, invalid, refusal, failure, retry, offline, and permission-denied states; mark non-applicable states with reasons.\n3. For each state, define visible copy, enabled actions, focus destination, keyboard behaviour, screen-reader announcement, and recovery route.\n4. Identify destructive or irreversible actions and specify confirmation proportional to consequence.\n5. Link each state to requirements and acceptance criteria. Return policy gaps to Capture & Refine rather than choosing them.\n6. Review edge transitions: double activation, navigation during pending work, delayed response, and a result that arrives after the view changes.\n7. Record review owner, covered states, gaps, decision, timestamp, and exact PRD/design revision.\n\n## Outputs\nJourney/state model, interaction and content specification, accessibility notes, coverage matrix, decision log, and `ready`, `incomplete`, `conflicting`, or `blocked` status.\n\n## Stop gates\nStop when approval is missing, product policy is unresolved, a relevant failure or accessibility state lacks treatment, or the design conflicts with the PRD.\n\n## Example\nFor cancellation, the primary action opens a confirmation naming the cutoff. Submission disables repeat activation and announces progress. `cancelled` moves focus to a status heading; `too_late` preserves the order and offers help; an unknown result says it is safe to retry using the same request.\n\n## Quality check\nEvery applicable state has content, action, focus, announcement, and recovery; design decisions cite requirements; readiness is revision-bound and has an owner.\n", "sha256": "aa85aa9ba63d695cf12c3213ae52829ec9be3723661451fc209c061ebfe7c8ee", "bytes": 2173}, "roles/03-planner.md": {"path": "roles/03-planner.md", "content": "# 03 — Planner\n\n## Mission\nConvert approved product intent and ready design into a sequenced technical plan with explicit boundaries, risks, verification points, and rollback considerations.\n\n## Starts with\n- approved PRD and ready design bound to the same revision;\n- repository and service boundaries in scope;\n- relevant engineering standards and current interfaces; and\n- known delivery constraints.\n\n## Method\n1. Verify input revisions and trace every planned change to requirements and design states.\n2. Inspect only the relevant system surfaces and identify state ownership, data consistency boundaries, interfaces, and migration needs.\n3. Split work into independently verifiable increments ordered by dependency.\n4. Define tests and observability for success, refusal, retry, concurrency, and rollback before coding.\n5. Mark assumptions and assign owners; return product or design questions rather than encoding them as architecture.\n\n## Produces\n- component and interface impact map;\n- ordered implementation plan;\n- requirement-to-task and task-to-test traceability;\n- risk, migration, rollout, and rollback notes; and\n- `ready_for_build` or `blocked` status.\n\n## Ownership and status\nPlanner owns technical sequencing and the proposed consistency strategy. Builder owns implementation details within the accepted plan. Product and Design retain their respective decisions. A plan becomes stale when its PRD/design inputs change.\n\n## Stop gates\nStop if inputs disagree, affected state ownership is unknown, atomicity cannot be reasoned about, destructive migration lacks rollback, or a task has no observable completion criterion.\n\n## Worked-example checkpoint\nThe example plan places authorization, expected-version checking, status transition, idempotency record, and event append in one atomic boundary. It explicitly notes that the teaching implementation's process lock is not a database transaction and specifies a durable transaction plus unique idempotency key and transactional outbox for production.\n\n## Limits\nPlanning does not modify code, claim feasibility proof, or mark the feature done. It defines a bounded route that Builder can execute and Tester can challenge.\n", "sha256": "44ed184d167dfddd0f5559c4769ed34262adab4190a210ecfd8a410f5aef9695", "bytes": 2194}, "skills/planner/SKILL.md": {"path": "skills/planner/SKILL.md", "content": "---\nname: planner\ndescription: Use when approved intent and ready design need a build plan.\nversion: 1.0.0\n---\n# Plan a traceable implementation\n\n## Purpose and boundary\nCreate a dependency-ordered technical plan. Do not implement, change product policy, or claim feasibility without inspection.\n\n## Inputs\nExact approved PRD, ready design, affected repository/service boundaries, current contracts, engineering standards, deployment constraints, and owners.\n\n## Steps\n1. Validate matching input revisions and make a requirement-to-design index.\n2. Locate state owners and interface boundaries relevant to the change. Record assumptions instead of broad architecture archaeology.\n3. Define invariants: authorization, allowed state transitions, idempotency identity, expected-version behaviour, side effects, and failure atomicity.\n4. Select a consistency boundary and explain where it holds. For distributed work, specify durable uniqueness, transaction scope, event publication, crash recovery, and reconciliation.\n5. Split the work into dependency-ordered increments. Each task names changed surfaces, requirement IDs, proof command, rollback, and owner.\n6. Plan negative, retry, race, migration, compatibility, and observability checks.\n7. Review risks and return unresolved product/design questions to their owners.\n\n## Outputs\nImpact map, invariants, task sequence, test strategy, risk/migration/rollout/rollback notes, traceability matrix, and `ready_for_build` or `blocked`.\n\n## Stop gates\nStop for stale inputs, unknown state ownership, contradictory interfaces, unbounded migration, no rollback, undefined atomicity, or tasks without observable proof.\n\n## Example\nFor cancellation, one atomic operation checks request-key reuse, loads the order, verifies owner/version/status, updates status, records the idempotency result, and appends an event. The teaching plan permits one-process locking; the production note requires a database transaction, unique request-key constraint, and transactional outbox.\n\n## Quality check\nEvery task links backward to intent and forward to a check; race and failure boundaries are explicit; illustrative shortcuts are labelled rather than generalized.\n", "sha256": "a681c652d0f893aaf6b2106ffb9b28665b5c2250e0a9bed1d1c2d22723e7d572", "bytes": 2194}, "roles/04-builder.md": {"path": "roles/04-builder.md", "content": "# 04 — Builder\n\n## Mission\nImplement the accepted plan as the smallest coherent change while preserving traceability, compatibility, and stated consistency guarantees.\n\n## Starts with\n- a `ready_for_build` plan linked to exact PRD and design revisions;\n- repository scope, coding standards, and test command;\n- required interfaces and migration/rollback approach; and\n- explicit human authority for code changes.\n\n## Method\n1. Establish a failing test for the next acceptance criterion where practical.\n2. Implement only the scoped behaviour; keep policy visible in named states and result codes.\n3. Make idempotency, ownership, status transitions, and atomicity boundaries explicit.\n4. Run focused tests after each coherent change, then the agreed broader checks.\n5. Record deviations from plan, changed files, commands, results, and known limits.\n\n## Produces\n- implementation and automated tests;\n- migration/configuration changes where authorised;\n- build receipt with exact commands and outcomes; and\n- `built_for_test` or `blocked` status.\n\n## Ownership and status\nBuilder owns code correctness against the plan and truthful execution receipts. Builder does not own product acceptance, design approval, independent quality judgment, or release authorization.\n\n## Stop gates\nStop on an unapproved scope expansion, conflicting requirement, unsafe migration, unavailable required secret/environment, unexplained failing baseline, or inability to preserve the promised atomic boundary. Escalate rather than weaken a constraint silently.\n\n## Worked-example checkpoint\nThe dependency-free Python implementation uses one lock around request-key lookup, authorization and version checks, state transition, event append, and idempotency recording. The first test run fails because the implementation is absent; the second passes after implementation.\n\n## Limits\nThe example proves same-process behaviour only. Passing unit tests do not prove durability, distributed exclusion, payment reversal, notification delivery, deployment safety, or production readiness.\n", "sha256": "15f3422ea50434e08868a0b40050faaffcf27e2f5123aaa49f1992f6dc6ca276", "bytes": 2061}, "skills/builder/SKILL.md": {"path": "skills/builder/SKILL.md", "content": "---\nname: builder\ndescription: Use when an accepted plan must become tested scoped code.\nversion: 1.0.0\n---\n# Build from a verified plan\n\n## Purpose and boundary\nImplement the accepted scope and retain truthful execution evidence. Do not expand policy, approve your own work, or imply release readiness.\n\n## Inputs\nReady plan, exact PRD/design revisions, repository scope, coding standards, test command, baseline state, and change authority.\n\n## Steps\n1. Confirm clean scope and inspect current behaviour at the named revision.\n2. Add a focused test that fails for the missing behaviour; capture command, exit code, and meaningful failure.\n3. Implement the smallest coherent increment with explicit state/result names.\n4. Put related checks and writes inside the planned atomic boundary. Make idempotency conflict behaviour explicit.\n5. Run focused tests, then agreed broader checks. Never erase a failure from the receipt.\n6. Compare diff to plan and acceptance criteria. Record justified deviations and send policy changes upstream.\n7. Produce a build receipt listing files, commands, outcomes, limitations, and status.\n\n## Outputs\nCode, tests, migration/configuration only if authorised, RED/GREEN proof, build receipt, and `built_for_test` or `blocked`.\n\n## Stop gates\nStop on scope drift, unsafe migration, unresolved requirement, missing environment/credential, unexplained baseline failure, or an atomicity promise the implementation cannot uphold.\n\n## Example\nThe order example first runs tests without `order_cancellation.py` and records `ModuleNotFoundError`. The implementation then adds typed statuses and result codes, a lock-protected store, request fingerprints, one state transition, and one event append. The same command passes all tests.\n\n## Quality check\nNo placeholder paths or empty functions; test failure is causally relevant; implementation limits are visible; result is not described as production-ready.\n", "sha256": "f072d06b74698aa7b0c20ca36537f165869d64d86116e71da5bc7cc2f502e505", "bytes": 1932}, "roles/05-tester.md": {"path": "roles/05-tester.md", "content": "# 05 — Tester\n\n## Mission\nChallenge the built change against the approved behaviour, design states, and technical risks, preserving reproducible evidence and unsupported areas.\n\n## Starts with\n- exact implementation revision and build receipt;\n- requirement, design, and plan traceability;\n- executable test environment and seed data; and\n- declared risk and atomicity boundaries.\n\n## Method\n1. Verify tests would fail for the missing or broken behaviour, not merely execute green.\n2. Exercise happy path, authorization, boundary statuses, validation, repeated requests, key misuse, stale versions, and concurrent attempts.\n3. Check state and side effects, not just return values.\n4. Preserve command, environment, exit code, output, and coverage limits in repository-safe paths.\n5. Classify each criterion as supported, failed, blocked, or unassessed.\n\n## Produces\n- executable tests and RED/GREEN evidence;\n- acceptance and risk coverage matrix;\n- defect reports with minimal reproduction; and\n- `tested`, `failed`, or `blocked` status.\n\n## Ownership and status\nTester owns the accuracy of test evidence and the distinction between assessed and unassessed claims. Reviewer decides whether the whole evidence set is sufficient. A green test is evidence only for the behaviour it asserts.\n\n## Stop gates\nStop and report when the target revision is unclear, fixtures do not represent the agreed state, a failure cannot be reproduced, environment limitations invalidate the result, or a concurrency claim exceeds the test boundary.\n\n## Worked-example checkpoint\nNine standard-library tests verify allowed cancellation, ownership refusal, fulfilment cutoff, idempotent replay, key conflict, repeated cancellation, missing order, stale version, and a twelve-thread race that emits exactly one cancellation event.\n\n## Limits\nThe concurrency test validates one process and one store instance. It is not evidence for multiple workers, database isolation, crash recovery, external event delivery, or load performance.\n", "sha256": "956ce1f65d512536965e08b74abf645b877fb75e3efbbcb6072235886bea1a8c", "bytes": 2012}, "skills/tester/SKILL.md": {"path": "skills/tester/SKILL.md", "content": "---\nname: tester\ndescription: Use when built behaviour needs adversarial executable proof.\nversion: 1.0.0\n---\n# Test behaviour and evidence boundaries\n\n## Purpose and boundary\nProduce reproducible evidence for specific claims and expose unassessed risk. Do not convert a green suite into blanket confidence.\n\n## Inputs\nExact revision, PRD criteria, design states, plan invariants, build receipt, executable environment, fixtures, and known baseline failures.\n\n## Steps\n1. Build a matrix of criteria and risks: allowed action, owner refusal, lifecycle cutoff, replay, key misuse, stale write, concurrent write, and side effects.\n2. Inspect test or mutation history to establish that tests can fail for missing behaviour.\n3. Exercise outcomes and persisted state. Count events or other side effects when “exactly once” is claimed.\n4. Run race tests with synchronized starts and assert the invariant, not thread order.\n5. Preserve command, runtime, exit code, full result, and target revision at safe relative paths.\n6. Classify each claim `supported`, `failed`, `blocked`, or `unassessed`; describe environment boundaries.\n7. File reproducible defects and rerun the same checks after repair.\n\n## Outputs\nTests, RED/GREEN logs, coverage/traceability matrix, defects, limits, and `tested`, `failed`, or `blocked`.\n\n## Stop gates\nStop when revision identity is unclear, fixture policy differs from the PRD, evidence is truncated, a failure is not reproducible, or the environment cannot support the claim.\n\n## Example\nLaunch twelve cancellation calls behind a barrier with distinct request keys. Assert one `cancelled`, eleven `already_cancelled`, one event, and one version increment. State explicitly that this proves only a single process/store instance.\n\n## Quality check\nTests assert refusal and side effects; RED is meaningful; GREEN is freshly executed; every evidence claim states what it does not cover.\n", "sha256": "73353d42f774eb10f581a51e6416b8006bda3196023892869d44b8bb344d19b6", "bytes": 1912}, "roles/06-reviewer.md": {"path": "roles/06-reviewer.md", "content": "# 06 — Reviewer\n\n## Mission\nMake an independent, evidence-based decision about whether the change satisfies its agreement without overstating what tests or inspection prove.\n\n## Starts with\n- exact revision and complete diff;\n- approved PRD, design, plan, build receipt, and test evidence;\n- known baseline failures and declared limits; and\n- reviewer independence and decision authority.\n\n## Method\n1. Trace each acceptance criterion to implementation and an observed check.\n2. Inspect authorization, state transitions, idempotency, race handling, failure paths, compatibility, and operator visibility.\n3. Attack false greens: tests that never fail, assertions that omit side effects, fixtures inconsistent with the requirement, and concurrency tests that overclaim scope.\n4. Separate merge confidence from release confidence.\n5. Record blocking findings, non-blocking concerns, unsupported claims, and a revision-bound decision.\n\n## Produces\n- finding list with severity and evidence locators;\n- acceptance-criterion disposition;\n- `changes_requested`, `merge_candidate`, or `blocked` decision; and\n- release checks still required.\n\n## Ownership and status\nReviewer owns the review decision for the inspected revision, not product policy or deployment authorization. Any material change invalidates the decision until delta review.\n\n## Stop gates\nStop if the exact revision is unavailable, evidence is missing, reviewer independence is compromised for a required gate, or a critical consistency/security question remains unanswered.\n\n## Worked-example checkpoint\nThe reviewer accepts the in-process example as a teaching implementation because all nine tests pass and the lock covers mutation plus event append. The reviewer explicitly withholds production and release confidence because there is no durable transaction, outbox, multi-process test, payment integration, deployment check, or rollback exercise.\n\n## Limits\nReview is a reasoned judgment over supplied evidence. It does not authenticate users, execute production flows, or turn illustrative policy into adopted policy.\n", "sha256": "8e830dafcf9afa4de017788094a8e9fe9e4da937e7a68a5de66e15f80013f15d", "bytes": 2086}, "skills/reviewer/SKILL.md": {"path": "skills/reviewer/SKILL.md", "content": "---\nname: reviewer\ndescription: Use when a tested change needs an independent decision.\nversion: 1.0.0\n---\n# Review a change against evidence\n\n## Purpose and boundary\nDecide whether the exact change is a merge candidate and identify remaining release work. Do not rely on status prose when inspectable evidence exists.\n\n## Inputs\nExact revision/diff, approved PRD and design, plan, build receipt, tests/logs, baseline, known limits, and reviewer identity.\n\n## Steps\n1. Confirm revision and input versions; material changes invalidate earlier review.\n2. Trace every acceptance criterion to code and an observed test. Mark missing links.\n3. Inspect security and consistency invariants: ownership, state authorization, stale writes, request-key scope, race behavior, mutation/event atomicity, and error disclosure.\n4. Challenge the tests: could they stay green if behaviour broke? Do they inspect state and side effects? Does concurrency setup actually overlap attempts?\n5. Separate merge checks from release checks such as integration, configuration, deployment, rollback, monitoring, and external delivery.\n6. Record findings with severity, locator, consequence, and precise fix. Recheck resolved blockers.\n7. Issue `changes_requested`, `merge_candidate`, or `blocked`, bound to the revision.\n\n## Outputs\nFindings, criterion disposition, unsupported-claim list, merge decision, release gap list, and reviewer/revision receipt.\n\n## Stop gates\nStop for missing exact revision, incomplete evidence, inconsistent fixtures, required independence conflict, or unanswered critical security/data-integrity risk.\n\n## Example\nAccept the sample as a merge candidate for an educational in-memory program after nine tests pass. Withhold production confidence because one lock does not coordinate processes, state is not durable, and event publication has no outbox or delivery acknowledgement.\n\n## Quality check\nNo finding is based on inference alone; no passing command is treated as semantic proof beyond its assertions; status names owner and revision.\n", "sha256": "c11a87fca19ad1a6fd5f1318a1ea860ef45417b90773b324e5ce0ec374d872b3", "bytes": 2042}, "roles/07-curator.md": {"path": "roles/07-curator.md", "content": "# 07 — Curator\n\n## Mission\nTurn verified delivery findings into governed improvements to reusable skills, domain knowledge, and future work without rewriting history or treating one example as universal policy.\n\n## Starts with\n- revision-bound review and test evidence;\n- defects, surprises, and repeated-friction observations;\n- owners for reusable method, domain policy, and product fixes; and\n- an approved contribution path.\n\n## Method\n1. Classify each learning as reusable method, domain fact/decision, product defect, or local implementation note.\n2. Require evidence and an owner; preserve conflicts and effective dates.\n3. Propose the smallest update in the correct home: `skills/`, `domain/`, or product backlog.\n4. Review the proposal for overfitting, privacy, stale evidence, and backward compatibility.\n5. Version accepted changes and define how a later feature will show whether the change helped.\n\n## Produces\n- curated learning record with provenance;\n- proposed or accepted skill/domain update;\n- owner, status, version, and review date; and\n- next-use recheck criterion.\n\n## Ownership and status\nCurator owns classification and maintenance workflow. Domain owners approve business facts; skill maintainers approve reusable method; product owners prioritize product fixes. `proposed` must never be presented as `accepted`.\n\n## Stop gates\nStop if a learning contains private source material, lacks evidence, has no owner, generalizes from one case without review, conflicts with current policy, or would silently change an approved product decision.\n\n## Worked-example checkpoint\nThe race test reinforces a reusable question: “Can two valid requests attempt this transition concurrently, and which side effects must occur once?” The cancellable statuses remain in domain context, not the generic skill. A production outbox remains a proposed engineering improvement, not a claim about the teaching code.\n\n## Limits\nCuration improves the next decision process; it does not prove adoption, automatically edit governing sources, or close a release gate.\n", "sha256": "70a77e19be0ba3d31cedb42eab0012a65745b2697bf20d518055451d86065d59", "bytes": 2072}, "skills/curator/SKILL.md": {"path": "skills/curator/SKILL.md", "content": "---\nname: curator\ndescription: Use when delivery findings should improve the next change.\nversion: 1.0.0\n---\n# Curate evidence-backed learning\n\n## Purpose and boundary\nPlace verified learning in the correct governed home. Do not copy private evidence, silently change policy, or universalize one local solution.\n\n## Inputs\nReview/test evidence, defects and surprises, current skill/domain versions, provenance, maintainers, domain owners, and contribution rules.\n\n## Steps\n1. State the finding and its evidence without confidential payloads.\n2. Classify it: reusable method, domain fact/decision, product defect, or local implementation note.\n3. Choose one home: skill for portable questions/process; domain for approved business meaning; backlog for a product change; local note for implementation detail.\n4. Draft the smallest update with status `proposed`, owner, source, effective date, and conflicts.\n5. Review for overfitting, privacy, safety, compatibility, and whether one counterexample would invalidate the rule.\n6. Obtain the correct approval. Mark `accepted` only after owner decision; retain rejected/superseded history.\n7. Define a next-use check and review date, then observe whether the change reduces missed decisions or rework.\n\n## Outputs\nCurated learning record, proposed/accepted update, owner, version, provenance, conflict status, review date, and next-use measure.\n\n## Stop gates\nStop for private content, absent evidence, unknown owner, unresolved contradiction, universal claims from one case, or an update that changes approved policy without product authority.\n\n## Example\nFinding: simultaneous valid cancellation requests can duplicate side effects if transition and event publication are separate. Reusable skill update: always ask which side effects must occur once under concurrency. Domain remains: only `placed` and `confirmed` are cancellable. Product proposal: evaluate a transactional outbox. These are three different records and owners.\n\n## Quality check\nMethod and business facts remain separate; proposal is not adoption; provenance is safe; a later work item can test whether the learning helped.\n", "sha256": "094b454014bcbf15c18467ce9a8ef73a124152ede0b8e849a998a6abff92ece9", "bytes": 2139}, "domain/order-cancellation.md": {"path": "domain/order-cancellation.md", "content": "# Order cancellation domain context\n\n**Status:** illustrative, agreed for this showcase only\n**Owner:** fictional Order Experience product owner\n**Version:** 1.0\n**Scope:** customer-initiated cancellation before fulfilment\n**Not evidence of:** any named client's policy, implementation, adoption, or production behaviour\n\n## Purpose\nThis file contains product-specific meaning. The role and skill files contain reusable method. Moving these rules into a generic skill would incorrectly make one fictional product's policy universal.\n\n## Terms\n- **Owning customer:** the authenticated customer whose identifier is attached to the order.\n- **Placed:** the order has been accepted but not confirmed for fulfilment.\n- **Confirmed:** the order is accepted and remains before fulfilment work starts.\n- **Fulfilment started:** picking, preparation, or equivalent execution has begun.\n- **Cancellation:** a transition that prevents further order fulfilment in this example.\n- **Request key:** a caller-generated idempotency key identifying one cancellation intent.\n- **Expected version:** an optional last-seen order version used to reject a stale write.\n\n## Lifecycle policy\n\n| Current status | Owner may request cancellation | Outcome |\n| --- | --- | --- |\n| `placed` | yes | transition to `cancelled` |\n| `confirmed` | yes | transition to `cancelled` |\n| `fulfilment_started` | no | `too_late`; status unchanged |\n| `shipped` | no | `too_late`; status unchanged |\n| `cancelled` | no new transition | `already_cancelled`; status unchanged |\n\nOnly the owning customer may use this customer route. An unknown order returns `not_found`. This teaching policy uses a distinct `not_owner` result for clarity; a production threat model may intentionally conceal order existence, which would require a new product/security decision.\n\n## Idempotency and concurrency agreement\n1. A request key identifies the tuple `(order_id, actor_id, expected_version)`.\n2. Retrying the same tuple and key returns the original result and creates no additional event.\n3. Reusing a key for a different tuple is a conflict.\n4. A new key after cancellation returns `already_cancelled` and creates no additional event, even when it supplies an expected version older than the completed cancellation. This human-visible completed outcome takes precedence over `version_conflict`.\n5. If valid requests race, exactly one transition and one `order.cancelled` event occur; other attempts observe `already_cancelled`.\n6. Authorization, completed-cancellation, and expected-version checks happen in that precedence order against state inside the same atomic boundary as mutation.\n\n## Observable result codes\n`cancelled`, `already_cancelled`, `not_found`, `not_owner`, `too_late`, and `version_conflict`. Callers must branch on codes, not prose.\n\n## Event contract\nThe example event contains `event_type`, `order_id`, and `resulting_version`. It deliberately excludes payment, personal data, and notification payloads. A production contract would need an event identifier, timestamp, schema version, durable publication state, retention policy, and consumer compatibility review.\n\n## Explicit exclusions and unknowns\n- Payment authorization reversal, refund timing, fees, stock release, loyalty effects, tax documents, notifications, and customer support override are outside this implementation.\n- No service-level objective or throughput target is claimed.\n- No production identity, authorization, database, broker, or deployment is exercised.\n- Whether cancellation and payment reversal must share one distributed transaction is unresolved and must be decided for a real product.\n\n## Atomicity caveat\nThe example stores orders, events, and request-key records in memory under one `RLock`. This is atomic only for threads sharing one store in one process and disappears on restart. A production design normally needs a durable database transaction, a uniqueness constraint over the scoped request key, an expected-version or row-lock strategy, and a transactional outbox or equivalent. Event delivery may be at least once, so consumers still need deduplication.\n\n## Change control\nA proposed domain change records owner, rationale, source, effective version, affected criteria, and conflict status. Only the fictional product owner can mark it accepted for this showcase. Generic skills may ask about statuses and races; they must not hard-code these status choices.\n", "sha256": "ae73d9912aa60107bb1314973bf4bf45e2cd0ad035a941f4ab965ca68e6cd457", "bytes": 4426}, "docs/worked-example.md": {"path": "docs/worked-example.md", "content": "# Worked example guide\n\nThe repository follows one synthetic request through all seven roles in the required order:\n\n1. Capture & Refine: `worked-example/00-intake.md`, `01-decisions.md`, `02-prd.md`\n2. Design: `worked-example/03-design.md`\n3. Planner: `worked-example/04-plan.md`\n4. Builder: `worked-example/order_cancellation.py`\n5. Tester: `tests/test_order_cancellation.py`, `worked-example/evidence/`\n6. Reviewer: `worked-example/05-review.md`\n7. Curator: `worked-example/06-curation.md`\n\nRun from repository root:\n\n```sh\npython3 -m unittest discover -s tests -v\n```\n\nReproduce the expected semantic RED without editing the repository:\n\n```sh\npython3 worked-example/evidence/reproduce_idempotency_negative_control.py\n```\n\nThat command exits 1 because its disposable mutation removes exact-result replay; `worked-example/evidence/semantic-red.txt` binds the retained result to SHA-256 proof identities. The older `red.txt` remains a separate historical missing-implementation receipt.\n\nThe example uses only the Python standard library. It is a prepared, inspectable walkthrough—not a recording of autonomous agents. Read `domain/order-cancellation.md` before interpreting statuses, idempotency, or atomicity. The implementation demonstrates one-process behavior and deliberately documents the production delta.\n", "sha256": "9aa2fd093d77a046c59cec90f87b0d567d60a844cf20f625f6021eb9eefce7a9", "bytes": 1318}, "README.md": {"path": "README.md", "content": "# From request to confidence — seven-role showcase\n\nA generic, client-safe masterclass content pack showing how one ambiguous order-cancellation request moves through **Capture & Refine → Design → Planner → Builder → Tester → Reviewer → Curator**.\n\n## What is real\nThe Markdown files and Python implementation are complete repository artifacts. The unit tests execute with Python's standard library. RED and GREEN logs were captured from actual commands and are retained under `worked-example/evidence/`.\n\n## What is illustrative\nThe order policy, owners, approvals, design decision, role handoffs, and review narrative are synthetic teaching material. They are not live autonomous-agent runs, client policy, human authentication, production adoption, or release evidence.\n\n## Explore\n- `roles/` — responsibilities, inputs, outputs, ownership, status, stop gates, and limits for all seven roles.\n- `skills/` — portable methods; one substantive skill per role.\n- `domain/order-cancellation.md` — fictional business policy kept separate from reusable method.\n- `worked-example/` — intake through curation, runnable code, and execution evidence.\n- `tests/` — twelve behavior and race tests.\n- `docs/worked-example.md` — route and command.\n- `docs/traceability.md` — requirement-to-artifact and evidence map.\n\n## Reproduce, build, and verify\n\n```sh\npython3 -m venv .venv\n.venv/bin/python -m pip install -r requirements.txt\nnpm ci\nnpx playwright install chromium\n.venv/bin/python scripts/build_experience.py\n.venv/bin/python scripts/verify_source_parity.py --source-root .\npython3 -m unittest discover -s tests -v\nnpm test\n.venv/bin/python scripts/render_pdf_qa.py presentation/Masterclass-Experience.pdf\n```\n\nThe content example itself uses only Python's standard library. Deck generation and QA require Python 3, LibreOffice (`soffice`), Node.js/npm, Chromium for Playwright, and the pinned Python/npm dependencies above. The build writes the offline experience to `web/index.html`, the deck to `presentation/`, and self-contained relative downloads to `web/downloads/`.\n\n## Atomicity and idempotency boundary\nThe example's lock makes request-key lookup, state mutation, event append, and result recording atomic only for threads sharing one in-memory store. It does not survive restart or coordinate multiple processes. A production design needs durable uniqueness, transaction boundaries, outbox/delivery handling, consumer deduplication, crash testing, and reconciliation.\n\n## Confidence statement\nPassing tests support the specific in-process assertions in the test file. They do not support claims about production security, durability, payments, distributed delivery, deployment, rollback, service levels, or release readiness.\n", "sha256": "e163aa43733d0caafb1dd27e32aafea0f0610bf977363c1ee39f31d6d1ec9a66", "bytes": 2759}, "docs/traceability.md": {"path": "docs/traceability.md", "content": "# Traceability and evidence map\n\n**Status:** complete for educational repository scope\n**Evidence owner:** Tester role\n**Decision owner:** Reviewer role\n**Executable target:** `worked-example/order_cancellation.py`\n\n| Criterion | Decision/source | Design | Implementation | Test |\n| --- | --- | --- | --- | --- |\n| AC-1 owner cancels eligible order; one version/event | D1, D2, D8 | Eligible, Pending, Success | `cancel`, cancellable statuses, locked mutation | `test_owner_can_cancel_before_fulfilment`; direct `placed` branch: `test_owner_can_cancel_placed_order` |\n| AC-2 non-owner cannot mutate | D1 | Not owner/not found | `_decide`: `NOT_OWNER` | `test_non_owner_is_refused_without_mutation` |\n| AC-3 fulfilment cutoff preserves state | D2, D3 | Too late | `_decide`: `TOO_LATE` | `test_fulfilment_started_is_too_late`; direct `shipped` branch: `test_shipped_is_too_late` |\n| AC-4 exact replay returns original result once | D4 | Unknown result/retry | idempotency record lookup | `test_same_idempotency_key_replays_result_without_second_event` |\n| AC-5 key cannot identify another request | D5 | not applicable | request fingerprint conflict | `test_reusing_key_for_different_request_is_a_conflict` |\n| AC-6 new intent after success is harmless; completed outcome precedes stale version | D6, D7 | Already cancelled | `_decide`: `ALREADY_CANCELLED` before expected-version check | `test_new_key_after_cancellation_reports_existing_outcome`; `test_already_cancelled_precedes_stale_version_for_new_intent` |\n| AC-7 unknown order | lifecycle policy | Not owner/not found | `_decide`: `NOT_FOUND` | `test_unknown_order_is_not_found` |\n| AC-8 stale version does not mutate | D7 | Version conflict | expected-version check under lock | `test_stale_expected_version_is_rejected` |\n| AC-9 one race winner and one event | D8 | Pending/Success | store lock around decision, mutation, event, record | `test_concurrent_requests_emit_exactly_one_cancellation_event` |\n\n## Content contract evidence\n`tests/test_content_contract.py` verifies all seven role filenames and order, mandatory role contract sections, seven separate substantive skills with inputs/steps/outputs/stop gates/examples, separate domain policy, and absence of private-name or local-absolute-path markers in public materials.\n\n## RED/GREEN provenance\n- `worked-example/evidence/red.txt` retains the historical pre-implementation failure: missing `order_cancellation` module, exit 1. It proves only that the suite detects a completely missing implementation.\n- `worked-example/evidence/reproduce_idempotency_negative_control.py` reproducibly mutates exact replay in a disposable copy. `semantic-red.txt` records the resulting focused assertion failure, exit 1, plus SHA-256 identities for the reproducer, unmutated implementation, and behavior tests.\n- `worked-example/evidence/green.txt` records the final command result: 16 tests, exit 0; `verification.txt` retains the full output.\n\nThe logs are repository-safe transcriptions of command output. The historical RED traceback's machine-specific absolute frame path was replaced with a relative test path; the exception type/message, command, and exit code are unchanged. The semantic reproducer itself emits only a relative frame path.\n\n## Claim boundary\nThe evidence supports the behavior asserted in one Python 3.9 process. It leaves durability, multiple workers, crash recovery, external side-effect delivery, performance, security assessment, integrations, deployment, rollback, and release readiness unassessed.\n", "sha256": "e3b4bf7b06329b39cd9febcd1cdb18d42d19a427fb63fc5b6f36b49c97caa107", "bytes": 3531}, "tests/test_content_contract.py": {"path": "tests/test_content_contract.py", "content": "from __future__ import annotations\n\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nROLE_FILES = [\n    \"01-capture-refine.md\",\n    \"02-design.md\",\n    \"03-planner.md\",\n    \"04-builder.md\",\n    \"05-tester.md\",\n    \"06-reviewer.md\",\n    \"07-curator.md\",\n]\nSKILLS = [\"capture-refine\", \"design\", \"planner\", \"builder\", \"tester\", \"reviewer\", \"curator\"]\nPUBLIC_DIRS = [\n    ROOT / \"roles\",\n    ROOT / \"skills\",\n    ROOT / \"domain\",\n    ROOT / \"worked-example\",\n    ROOT / \"docs\",\n    ROOT / \"tests\",\n]\nPUBLIC_FILES = [ROOT / \"README.md\"]\n\n\nclass ContentContractTests(unittest.TestCase):\n    def test_all_roles_exist_in_required_order_and_define_contract(self) -> None:\n        self.assertEqual(ROLE_FILES, [path.name for path in sorted((ROOT / \"roles\").glob(\"*.md\"))])\n        for filename in ROLE_FILES:\n            text = (ROOT / \"roles\" / filename).read_text()\n            for section in (\"## Mission\", \"## Starts with\", \"## Produces\", \"## Ownership and status\", \"## Stop gates\"):\n                self.assertIn(section, text, f\"{filename} missing {section}\")\n\n    def test_each_role_has_a_substantive_separate_skill(self) -> None:\n        for skill in SKILLS:\n            path = ROOT / \"skills\" / skill / \"SKILL.md\"\n            self.assertTrue(path.is_file(), str(path.relative_to(ROOT)))\n            text = path.read_text()\n            for section in (\"## Inputs\", \"## Steps\", \"## Outputs\", \"## Stop gates\", \"## Example\"):\n                self.assertIn(section, text, f\"{skill} missing {section}\")\n            self.assertGreaterEqual(len(text.splitlines()), 25)\n\n    def test_domain_policy_is_separate_from_skills(self) -> None:\n        domain = (ROOT / \"domain\" / \"order-cancellation.md\").read_text()\n        self.assertIn(\"## Lifecycle policy\", domain)\n        self.assertIn(\"## Atomicity caveat\", domain)\n        generic_capture_skill = (ROOT / \"skills\" / \"capture-refine\" / \"SKILL.md\").read_text()\n        self.assertNotIn(\"Only the owning customer\", generic_capture_skill)\n\n    def test_public_material_has_no_private_or_absolute_path_markers(self) -> None:\n        forbidden = (\n            \"/\" + \"Users\" + \"/\",\n            \"Sa\" + \"bre\",\n            \"sa\" + \"bre\",\n            \"Code\" + \"walnut\",\n        )\n        paths = list(PUBLIC_FILES)\n        for directory in PUBLIC_DIRS:\n            paths.extend(path for path in directory.rglob(\"*\") if path.is_file())\n        for path in paths:\n            if path.suffix in {\".md\", \".py\", \".txt\"}:\n                text = path.read_text()\n                for marker in forbidden:\n                    self.assertNotIn(marker, text, f\"{marker!r} found in {path.relative_to(ROOT)}\")\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n", "sha256": "436a788b5e8c24b78bcaefe67cdee768055f2df888c5f1e4144cfeb2f1c33aeb", "bytes": 2711}, "tests/test_order_cancellation.py": {"path": "tests/test_order_cancellation.py", "content": "from __future__ import annotations\n\nimport sys\nimport threading\nimport unittest\nfrom concurrent.futures import ThreadPoolExecutor\nfrom pathlib import Path\n\nEXAMPLE_DIR = Path(__file__).resolve().parents[1] / \"worked-example\"\nsys.path.insert(0, str(EXAMPLE_DIR))\n\nfrom order_cancellation import (  # noqa: E402\n    CancellationCode,\n    IdempotencyConflict,\n    InMemoryOrderStore,\n    Order,\n    OrderCancellationService,\n    OrderStatus,\n)\n\n\nclass OrderCancellationTests(unittest.TestCase):\n    def setUp(self) -> None:\n        self.store = InMemoryOrderStore(\n            [Order(order_id=\"ORD-1042\", owner_id=\"customer-7\", status=OrderStatus.CONFIRMED)]\n        )\n        self.service = OrderCancellationService(self.store)\n\n    def test_owner_can_cancel_before_fulfilment(self) -> None:\n        result = self.service.cancel(\"ORD-1042\", \"customer-7\", \"req-001\", expected_version=1)\n\n        self.assertEqual(CancellationCode.CANCELLED, result.code)\n        self.assertEqual(OrderStatus.CANCELLED, self.store.get(\"ORD-1042\").status)\n        self.assertEqual(2, self.store.get(\"ORD-1042\").version)\n        self.assertEqual(1, len(self.store.events))\n\n    def test_owner_can_cancel_placed_order(self) -> None:\n        store = InMemoryOrderStore(\n            [Order(order_id=\"ORD-1043\", owner_id=\"customer-7\", status=OrderStatus.PLACED)]\n        )\n\n        result = OrderCancellationService(store).cancel(\n            \"ORD-1043\", \"customer-7\", \"req-placed\", expected_version=1\n        )\n\n        self.assertEqual(CancellationCode.CANCELLED, result.code)\n        self.assertEqual(OrderStatus.CANCELLED, store.get(\"ORD-1043\").status)\n        self.assertEqual(2, store.get(\"ORD-1043\").version)\n        self.assertEqual(1, len(store.events))\n\n    def test_non_owner_is_refused_without_mutation(self) -> None:\n        result = self.service.cancel(\"ORD-1042\", \"customer-8\", \"req-002\")\n\n        self.assertEqual(CancellationCode.NOT_OWNER, result.code)\n        self.assertEqual(OrderStatus.CONFIRMED, self.store.get(\"ORD-1042\").status)\n        self.assertEqual([], self.store.events)\n\n    def test_fulfilment_started_is_too_late(self) -> None:\n        store = InMemoryOrderStore(\n            [Order(order_id=\"ORD-2042\", owner_id=\"customer-7\", status=OrderStatus.FULFILMENT_STARTED)]\n        )\n\n        result = OrderCancellationService(store).cancel(\"ORD-2042\", \"customer-7\", \"req-003\")\n\n        self.assertEqual(CancellationCode.TOO_LATE, result.code)\n        self.assertEqual(OrderStatus.FULFILMENT_STARTED, store.get(\"ORD-2042\").status)\n        self.assertEqual([], store.events)\n\n    def test_shipped_is_too_late(self) -> None:\n        store = InMemoryOrderStore(\n            [Order(order_id=\"ORD-2043\", owner_id=\"customer-7\", status=OrderStatus.SHIPPED)]\n        )\n\n        result = OrderCancellationService(store).cancel(\"ORD-2043\", \"customer-7\", \"req-shipped\")\n\n        self.assertEqual(CancellationCode.TOO_LATE, result.code)\n        self.assertEqual(OrderStatus.SHIPPED, store.get(\"ORD-2043\").status)\n        self.assertEqual(1, store.get(\"ORD-2043\").version)\n        self.assertEqual([], store.events)\n\n    def test_same_idempotency_key_replays_result_without_second_event(self) -> None:\n        first = self.service.cancel(\"ORD-1042\", \"customer-7\", \"req-004\")\n        replay = self.service.cancel(\"ORD-1042\", \"customer-7\", \"req-004\")\n\n        self.assertEqual(first, replay)\n        self.assertEqual(1, len(self.store.events))\n        self.assertEqual(2, self.store.get(\"ORD-1042\").version)\n\n    def test_reusing_key_for_different_request_is_a_conflict(self) -> None:\n        self.service.cancel(\"ORD-1042\", \"customer-7\", \"req-005\")\n\n        with self.assertRaises(IdempotencyConflict):\n            self.service.cancel(\"ORD-1042\", \"customer-9\", \"req-005\")\n\n    def test_new_key_after_cancellation_reports_existing_outcome(self) -> None:\n        self.service.cancel(\"ORD-1042\", \"customer-7\", \"req-006\")\n\n        result = self.service.cancel(\"ORD-1042\", \"customer-7\", \"req-007\")\n\n        self.assertEqual(CancellationCode.ALREADY_CANCELLED, result.code)\n        self.assertEqual(1, len(self.store.events))\n\n    def test_already_cancelled_precedes_stale_version_for_new_intent(self) -> None:\n        self.service.cancel(\"ORD-1042\", \"customer-7\", \"req-006-first\", expected_version=1)\n\n        result = self.service.cancel(\n            \"ORD-1042\", \"customer-7\", \"req-006-later\", expected_version=1\n        )\n\n        self.assertEqual(CancellationCode.ALREADY_CANCELLED, result.code)\n        self.assertEqual(OrderStatus.CANCELLED, result.order_status)\n        self.assertEqual(2, result.order_version)\n        self.assertEqual(1, len(self.store.events))\n\n    def test_unknown_order_is_not_found(self) -> None:\n        result = self.service.cancel(\"ORD-missing\", \"customer-7\", \"req-008\")\n\n        self.assertEqual(CancellationCode.NOT_FOUND, result.code)\n        self.assertEqual(\"ORD-missing\", result.order_id)\n        self.assertEqual([], self.store.events)\n\n    def test_stale_expected_version_is_rejected(self) -> None:\n        result = self.service.cancel(\"ORD-1042\", \"customer-7\", \"req-009\", expected_version=99)\n\n        self.assertEqual(CancellationCode.VERSION_CONFLICT, result.code)\n        self.assertEqual(OrderStatus.CONFIRMED, self.store.get(\"ORD-1042\").status)\n        self.assertEqual([], self.store.events)\n\n    def test_concurrent_requests_emit_exactly_one_cancellation_event(self) -> None:\n        workers = 12\n        barrier = threading.Barrier(workers)\n\n        def attempt(index: int):\n            barrier.wait()\n            return self.service.cancel(\"ORD-1042\", \"customer-7\", f\"race-{index:02d}\")\n\n        with ThreadPoolExecutor(max_workers=workers) as pool:\n            results = list(pool.map(attempt, range(workers)))\n\n        codes = [result.code for result in results]\n        self.assertEqual(1, codes.count(CancellationCode.CANCELLED))\n        self.assertEqual(workers - 1, codes.count(CancellationCode.ALREADY_CANCELLED))\n        self.assertEqual(1, len(self.store.events))\n        self.assertEqual(2, self.store.get(\"ORD-1042\").version)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n", "sha256": "e168e33f8948f689ba79f45cf64af6c0f93d5c6c61540d3f0a884c7aad483898", "bytes": 6117}, "worked-example/00-intake.md": {"path": "worked-example/00-intake.md", "content": "# Worked example — intake\n\n**Work item:** SHOWCASE-OC-1\n**Status:** refined in a prepared, synthetic walkthrough\n**Owner:** fictional Order Experience product owner\n**Implementation owner:** showcase Builder role\n**Evidence class:** illustrative repository artifact; not a live agent run\n\n## Raw request\n> Allow customers to cancel an order.\n\n## Known boundary\nCustomer self-service cancellation only. Staff override, refund execution, payment reversal, inventory release, notification delivery, and deployment are excluded.\n\n## Initial unknowns\nWho may cancel; which statuses remain cancellable; what a repeat does; how stale clients behave; what concurrent requests do; and whether cancellation side effects occur once.\n\n## Source register\n\n| ID | Source | Classification | Supports |\n| --- | --- | --- | --- |\n| REQ-1 | this synthetic intake | requested | customer cancellation outcome |\n| DEC-1 | `01-decisions.md` | decided | owner, states, replay, race policy |\n| DOM-1 | `../domain/order-cancellation.md` | decided | terms and lifecycle policy |\n| TEST-1 | `../tests/test_order_cancellation.py` | observed test artifact | executable assertions |\n| IMPL-1 | `order_cancellation.py` | observed implementation artifact | teaching implementation |\n\nAbsence of a payment or notification source is recorded as an exclusion/unknown, not evidence that those concerns do not exist.\n", "sha256": "8f693d8a7fe79d8a43c24cf647521915ef4aabd519b948cd1c86886aa998a4da", "bytes": 1382}, "worked-example/01-decisions.md": {"path": "worked-example/01-decisions.md", "content": "# Capture & Refine decision record\n\n**Status:** agreed for synthetic example\n**Decision owner:** fictional Order Experience product owner\n**Engineer reviewer:** showcase engineering role\n**Applies to:** SHOWCASE-OC-1 revision 1\n\n| ID | Atomic question | Decision | Why it matters |\n| --- | --- | --- | --- |\n| D1 | Who may use this route? | Only the owning customer. | Prevents one customer changing another's order. |\n| D2 | Which states are cancellable? | `placed` and `confirmed`. | Defines the fulfilment cutoff. |\n| D3 | What happens after fulfilment starts? | Return `too_late`; preserve status. | Makes the race outcome visible and safe. |\n| D4 | What does exact retry do? | Return the original result; no second event. | Supports retry after an unknown response. |\n| D5 | Can one key identify different requests? | No; raise an idempotency conflict. | Prevents accidental result aliasing. |\n| D6 | What does a new key do after cancellation? | Return `already_cancelled`; no second event, even if that later intent supplies a stale expected version. | Keeps the completed, human-visible outcome authoritative and repeated intent harmless. |\n| D7 | How is a stale client handled? | For an order not already cancelled, an optional expected version mismatch returns `version_conflict`. | Prevents mutation from stale state while preserving D6 precedence. |\n| D8 | What if valid requests race? | Exactly one transition and one cancellation event. | Defines the atomicity invariant. |\n\n## Open product decisions excluded from build\nRefund timing, payment reversal, stock release, customer notification, support override, privacy-preserving error disclosure, and production service levels. A real feature cannot claim end-to-end cancellation until owners decide these matters.\n", "sha256": "e6a5c8fe9711b0a7cf62b557fbe95a2a8a0b1f0c537675f0b753222880ae6e6c", "bytes": 1778}, "worked-example/02-prd.md": {"path": "worked-example/02-prd.md", "content": "# PRD — customer order cancellation\n\n**Work item:** SHOWCASE-OC-1\n**Status:** APPROVED FOR SYNTHETIC EXAMPLE\n**Revision:** 1\n**Owner:** fictional Order Experience product owner\n\n## Outcome\nAn owning customer can stop an order before fulfilment begins and can safely retry without creating duplicate cancellation effects.\n\n## Scope\nIn: customer action, ownership check, lifecycle cutoff, expected-version check, request-key replay, one cancellation event. Out: payment/refund, inventory, notifications, staff override, persistence, APIs, deployment.\n\n## Requirements\n- **FR-1 [REQ-1, D1, D2]:** The owning customer may cancel an order in `placed` or `confirmed`.\n- **FR-2 [D3]:** An order at `fulfilment_started` or `shipped` remains unchanged and returns `too_late`.\n- **FR-3 [D4, D5, D6]:** Exact request replay returns its original result; key misuse conflicts; later intent does not duplicate the event. For an already-cancelled order, `already_cancelled` takes precedence over a stale expected version.\n- **FR-4 [D7]:** For an order not already cancelled, a supplied stale expected version returns `version_conflict` without mutation.\n- **FR-5 [D8]:** Concurrent valid attempts cause one transition and one event.\n\n## Acceptance criteria\n- **AC-1:** Given an owned confirmed order, when its owner cancels at version 1, then status is `cancelled`, version is 2, and one event exists.\n- **AC-2:** Given an order owned by someone else, when an actor requests cancellation, then result is `not_owner` and state/events do not change.\n- **AC-3:** Given fulfilment has started, when the owner requests cancellation, then result is `too_late` and state/events do not change.\n- **AC-4:** Given a completed request, when its exact key and request are retried, then the original result is returned and no additional event exists.\n- **AC-5:** Given a used key, when a different request reuses it, then the call reports an idempotency conflict.\n- **AC-6:** Given a cancelled order, when a new request key is used, then result is `already_cancelled` and no additional event exists, including when the later request supplies the pre-cancellation expected version.\n- **AC-7:** Given an unknown order, cancellation returns `not_found` with no event.\n- **AC-8:** Given expected version 99 and actual version 1, cancellation returns `version_conflict` without mutation.\n- **AC-9:** Given twelve simultaneous valid attempts, exactly one returns `cancelled`, eleven return `already_cancelled`, one event exists, and version increments once.\n\n## Approval boundary\nThis approval is fictional metadata for the worked example. It does not authenticate a person or authorize production implementation.\n", "sha256": "0b26ee41d10054da8e5ee5f7d35be4618b0a2f4b7231f89052127e57e62292ca", "bytes": 2682}, "worked-example/03-design.md": {"path": "worked-example/03-design.md", "content": "# Design specification — cancellation states\n\n**Status:** ready for synthetic example\n**Bound to:** SHOWCASE-OC-1 PRD revision 1\n**Owner:** showcase Design role\n\n| State | Visible behaviour | Action/focus/accessibility |\n| --- | --- | --- |\n| Eligible | “Cancel order” available to owner. | Button is keyboard reachable and named with order context. |\n| Confirm | Explain cancellation cutoff and consequence. | Initial focus on heading; Cancel and Keep order are distinct. |\n| Pending | “Cancelling order…” | Disable repeat activation; announce polite progress. |\n| Success | “Order cancelled.” | Focus status heading; announce success once. |\n| Too late | “Fulfilment has started; this order can no longer be cancelled.” | Preserve order; offer fulfilment help route. |\n| Already cancelled | “This order is already cancelled.” This completed outcome is shown instead of a stale-version warning. | No destructive action; show current status. |\n| Not owner/not found | The teaching harness exposes typed codes, not customer copy. | Production disclosure policy remains unresolved. |\n| Version conflict | “Order changed. Refresh and review its current status.” | Focus message, offer refresh. |\n| Unknown transport result | “We could not confirm the result. Retry is safe.” | Retry reuses the same request key. |\n\n## Readiness decision\nThe states needed by the executable example are represented. Payment/refund, offline persistence, responsive visuals, localization, and production error-disclosure copy are excluded, so this is not production design readiness.\n", "sha256": "47f9ca4b30ef437c628ea28c8ddd11e2c22aa7f7836a484bc85884e40ce853f0", "bytes": 1593}, "worked-example/04-plan.md": {"path": "worked-example/04-plan.md", "content": "# Technical plan\n\n**Status:** implemented for teaching example\n**Inputs:** PRD revision 1 and design specification\n\n## Invariants\n- Only owner can mutate.\n- Only `placed`/`confirmed` can transition.\n- Mutation increments version once.\n- One accepted transition appends one cancellation event.\n- Same key and fingerprint replay exactly; different fingerprint conflicts.\n- Version and lifecycle checks occur inside the mutation lock.\n\n## Tasks and proof\n1. Define typed order statuses, result codes, immutable records, and store. Proof: import through test suite.\n2. Implement lock-scoped replay, checks, transition, event append, and result recording. Proof: AC-1–AC-8 tests.\n3. Synchronize twelve callers and assert exactly-once state/event invariant. Proof: AC-9.\n4. Preserve the historical missing-implementation RED, a reproducible semantic idempotency negative control, and final GREEN. Proof: `evidence/red.txt`, `evidence/semantic-red.txt`, its reproducer, and `evidence/green.txt`.\n\n## Atomic boundary\nThe in-memory store owns one re-entrant lock. The idempotency lookup, state read, checks, write, event append, and result record execute while holding it. This is deterministic for threads sharing that store.\n\n## Production delta\nReplace process memory with a durable transaction; enforce request-key uniqueness in storage; use optimistic version or row locking; write an outbox row in the same transaction; publish and acknowledge separately; make consumers idempotent; test crash points and multi-worker races; add reconciliation and observability.\n\n## Rollback\nThe example has no deployment or migration. A production rollback must not reverse already accepted cancellations blindly; it would require compatibility and reconciliation planning.\n", "sha256": "9a8c45e1ffc076e586d6db9cd98227ff4fb952134a929a675b4f79714b0a96f4", "bytes": 1758}, "worked-example/05-review.md": {"path": "worked-example/05-review.md", "content": "# Independent-style review record\n\n**Target:** repository revision and evidence identities recorded in `evidence/`\n**Status:** MERGE CANDIDATE FOR EDUCATIONAL USE\n**Reviewer stance:** adversarial evidence review, not a live product approval\n\n## Findings\n- The PRD criteria map to twelve executable tests and explicit implementation branches, including direct `placed`, `shipped`, and completed-cancellation/stale-version precedence cases.\n- The historical import RED only demonstrates detection of a completely missing implementation. The separate semantic negative control mutates exact replay and demonstrates that the idempotency assertion fails; GREEN shows the unmutated implementation passes all twelve behavior tests.\n- Ownership, status cutoff, expected version, request replay, key misuse, repeated intent, and a synchronized same-process race are asserted.\n- The lock encloses state update, event append, and idempotency record, so the tested one-process invariant is coherent.\n\n## Confidence boundaries\nThis does not prove database durability, multi-process exclusion, crash recovery, message-broker delivery, consumer deduplication, payment/refund behavior, security posture, performance, deployment, rollback, or production authorization. “Exactly once” here means one event object appended to one in-memory list under one lock, not exactly-once distributed delivery.\n\n## Decision\nSuitable as a runnable masterclass example with the above caveats displayed. Not suitable as a production reference architecture without the production delta in `04-plan.md`.\n", "sha256": "4775e451119ec45ecd3e52f1fb8e653f3b563ce5d7b68e511c3c727f9048814b", "bytes": 1573}, "worked-example/06-curation.md": {"path": "worked-example/06-curation.md", "content": "# Curation record\n\n**Status:** proposed learning set\n**Owners:** skill maintainer, fictional domain owner, and product backlog owner respectively\n\n| Finding | Classification | Destination | Status |\n| --- | --- | --- | --- |\n| Repeated actions need a request-identity decision. | reusable method | Capture & Refine skill | accepted in this pack |\n| Race questions must name side effects that occur once. | reusable method | Planner/Tester skills | accepted in this pack |\n| `placed` and `confirmed` are cancellable. | illustrative domain policy | domain context | accepted only for example v1 |\n| Durable outbox and unique key constraint are needed for a production candidate. | engineering proposal | future product plan | proposed, not implemented |\n| Payment/refund coupling remains undecided. | product gap | future Capture & Refine pass | open |\n\n## Next-use check\nOn the next state-changing feature, verify the refinement record asks both “what identifies a retry?” and “what happens when valid requests race?” Then inspect whether acceptance criteria cover state and side effects, not only response codes.\n", "sha256": "fac2ff384321fcfeee6dcb22e06a13e176b64d0a178b5221e64bc759d59b6b01", "bytes": 1121}, "worked-example/evidence/green.txt": {"path": "worked-example/evidence/green.txt", "content": "GREEN
